[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der
# es Installation und Updates fuehrt. Sie duerfen spaeter NIE geaendert
# werden - LoxBerry hielte das Plugin sonst fuer ein anderes, und jedes
# Update schluege fehl. Deshalb steht hier ein Projektname und eine
# noreply-Adresse und keine Person.
NAME=Fensterbilanz Plugin Authors
EMAIL=fensterbilanz@users.noreply.github.com

[PLUGIN]
VERSION=0.12.4
NAME=fensterbilanz
FOLDER=fensterbilanz
TITLE=Beschattung Fensterbilanz

[AUTOUPDATE]
# Seit 0.11.1 EIN. Bis 0.11.0 stand hier bewusst false, solange das
# Repository noch nicht stand: eine Adresse, die ins Leere zeigt, waere
# schlimmer als keine. Seit dem 23.08.2026 gibt es
# github.com/timanders22/LoxBerry-Plugin-Beschattung_Fensterbilanz mit dem
# Release zum Tag v0.11.0; die Adressen unten treffen also.
#
# Merke fuer den naechsten Fall: diese Zeile steht IM Plugin. Ein Wechsel
# von false auf true erreicht nur Anlagen, die mindestens einmal von Hand
# aktualisieren - wer nie aktualisiert, bekommt auch die Einstellung nicht,
# die das Aktualisieren einschalten wuerde.
#
# Bei jedem Release: VERSION hier UND in release.cfg erhoehen, beide
# Adressen dort auf den neuen Tag setzen, das Release mit genau diesem Tag
# anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
#
# Beide Adressen zeigen auf den Zweig master des EIGENEN Repositoriums - nie
# auf ein fremdes. LoxBerry vergleicht Fassungen als Zahl, und ein fremdes
# 2021.05.14 waere groesser als 0.10.0; daraus wuerde ein stilles Downgrade
# auf ein voellig anderes Plugin.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Beschattung_Fensterbilanz/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Beschattung_Fensterbilanz/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Mindestens 3.0.0: das Plugin liest config/system/general.json (MQTT-Gateway).
# Mit 2.0 liesse es sich installieren und liefe dann nicht.
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl ruft bei Ueberschreitung &fail() - die
# Installation wird abgebrochen, nicht nur gewarnt.
LB_MAXIMUM=false
# SYSTEM.ARCHITECTURE wird von plugininstall.pl gelesen und danach nie
# benutzt. Eine Angabe verhindert also nichts, waere aber eine unwahre
# Aussage - das Plugin ist reines PHP und laeuft ueberall.
ARCHITECTURE=false
