[AUTOUPDATE]
# Diese Datei gehoert in das Wurzelverzeichnis des GitHub-Repositories und
# steuert dort das Auto-Update. Sie wird erst wirklich abgerufen, wenn in
# der plugin.cfg AUTOMATIC_UPDATES auf true steht - und zwar ueber die
# Adresse, die dort unter RELEASECFG hinterlegt ist.
#
# DIES IST DIE DATEI FUER VORABFASSUNGEN. Sie zeigt derzeit auf denselben
# Stand wie die release.cfg - es gibt keine getrennte Vorabschiene. Bis
# 0.12.6 war sie eine byteweise Kopie der release.cfg samt deren
# Erklaertext, der nur von der release.cfg sprach; wer ihm folgte, liess
# DIESE Datei beim naechsten Release stehen, und jede Anlage mit
# eingeschalteten Vorabfassungen haette dauerhaft die alte Nummer
# angeboten bekommen.
#
# Bei jedem Release VIER Stellen gleichzeitig anfassen:
#   1. plugin.cfg     -> VERSION
#   2. release.cfg    -> VERSION und BEIDE Adressen auf den neuen Tag
#   3. prerelease.cfg -> dasselbe, solange beide Schienen gleich laufen
#   4. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
# Werkzeuge/fassung_setzen.py setzt 1 bis 3 in einem Aufruf.
#
# Die plugin.cfg liest DIESE Datei aus dem Zweig master, das ARCHIVEURL zieht
# aber aus dem TAG. Wer hier etwas aendert, ohne den Tag mitzuziehen, liefert
# an neue Installationen weiter den alten Stand aus.
VERSION=0.12.7
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Beschattung_Fensterbilanz/archive/refs/tags/v0.12.7.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Beschattung_Fensterbilanz/releases/tag/v0.12.7
