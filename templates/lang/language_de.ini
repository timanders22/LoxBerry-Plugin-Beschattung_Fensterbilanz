H_MODELL = "Das Modell"
MODELL_ERKLAERUNG = "Diese Werte bestimmen, wie aus Sonne, Raum und Jahreszeit ein Urteil wird. Die Vorgaben sind für ein mitteleuropäisches Wohnhaus gedacht. <b>Wer etwas ändert, sieht die Wirkung sofort</b> — nach dem Speichern wird neu gerechnet, und die Tabelle oben zeigt zu jedem Fenster den Satz, der das Urteil begründet."
L_TAGESGRENZE = "Tagesgrenze in Grad C — ab diesem erwarteten Tageshöchstwert ist Wärme Last"
H_TAGESGRENZE = "<b>Das ist der wichtigste Wert des ganzen Plugins.</b> Er beantwortet die Frage, an der eine Schaltbedingung in Loxone scheitert: nicht „ist es draußen warm?“, sondern „will das Haus heute Wärme?“. Am 23.08.2026 standen 19,5 Grad draußen und 32,7 Grad im Wohnzimmer — die Außenluft hätte „hereinlassen“ gesagt, der Tag wurde 28 Grad. Nicht zu verwechseln mit der Heizgrenztemperatur der Bauphysik (üblich 15 Grad): die bezieht sich auf das Tagesmittel, hier steht der Höchstwert, und der liegt in der Übergangszeit rund 5 Kelvin darüber."
L_SPREIZUNG_TAG = "Spreizung des Tagesteils in Kelvin"
L_SPREIZUNG_RAUM = "Spreizung des Raumteils in Zehntelkelvin"
H_SPREIZUNG = "Über diese Spanne läuft der jeweilige Teil stetig von +1 (Wärme willkommen) auf −1 (Wärme unerwünscht). Eine kleine Spanne macht das Urteil hart und sprunghaft, eine große weich und träge. 20 Zehntelkelvin sind 2,0 Kelvin."
L_GEWICHT_RAUM = "Gewicht des Raumteils in Prozent"
L_GEWICHT_TAG = "Gewicht des Tagesteils in Prozent"
H_GEWICHTE = "Die beiden Teile werden gewichtet addiert, nicht verundet. Ein UND ließe den Raum die Jahreszeit überstimmen — dann wäre im September alles zu; ein ODER umgekehrt — dann bliebe im August alles offen. Die Summe muss nicht genau 100 ergeben, es wird ohnehin auf die Summe bezogen. <b>Eine harte Obergrenze gibt es trotzdem:</b> ein Raum über seiner Beschattungsgrenze bekommt nie ein positives Urteil."
L_SCHWELLE_EIN = "Beschatten ab Urteil −x"
L_SCHWELLE_AUS = "Wieder freigeben ab Urteil −x"
H_SCHWELLEN = "Die beiden Werte bilden eine Hysterese. Ohne sie führe der Rollladen am Schwellwert im Minutentakt auf und ab. Die Ausschaltschwelle muss kleiner sein als die Einschaltschwelle."
L_E_REF = "Bezugsstrahlung: direkte Sonne am Glas in W/m²"
H_E_REF = "Ab diesem Wert zählt das Urteil in voller Höhe, darunter anteilig weniger. <b>Gewogen wird der DIREKTE Anteil</b>, nicht die gesamte Strahlung am Glas. Grund: Himmelslicht und Bodenreflex stehen an jedem Fenster, den ganzen Tag, und sind überall fast gleich groß — am 23.08.2026 waren das 121 W/m². Zählte man sie mit, verlangten auch die Nordfenster Beschattung, auf die gar keine Sonne fällt. Angezeigt werden in der Tabelle trotzdem die vollen Werte; nur das Gewicht des Urteils hängt am direkten Teil."
L_ALBEDO = "Bodenreflex (Albedo) in Prozent"
L_IAM = "Glas-Beiwert b0 (mal 100)"
