K_ZURUECK = "Zurückspielen"
LAGE_ERKLAERUNG = "Je Fenster ein Urteil von <b>−100</b> (unbedingt beschatten) bis <b>+100</b> (Sonne hereinlassen), dazu ein Digitalwert für die einfache Verdrahtung. Das Plugin <b>schaltet nichts</b>. Es liefert die Größe, die Loxone fehlt — ob der Sonneneintrag gerade erwünscht ist — und hängt an <span class='sm-mono'>AutoShade</span> des AutoJalousie-Bausteins. Dessen Winkel- und Lamellenrechnung bleibt unangetastet."
LUECKEN_ERKLAERUNG = "In der Liste stehen leere Zeilen <b>zwischen</b> belegten. Das stört nicht — eine leere Zeile wird übergangen. Wer es aufgeräumt mag, rückt sie mit diesem Knopf nach oben. <b>In Loxone ändert sich dadurch nichts:</b> die virtuellen Eingänge heißen nach dem Kürzel (<span class='sm-mono'>FB_&lt;kürzel&gt;_URTEIL</span>) und nicht nach der Zeilennummer. Die Wattstunden des laufenden Tages werden mit umgeschrieben, bleiben also bei ihrem Fenster."
