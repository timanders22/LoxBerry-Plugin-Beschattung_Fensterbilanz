; Fensterbilanz - deutsche Texte
;
; ACHTUNG: Hier stehen ECHTE Umlaute, keine HTML-Entitaeten. Beschriftungen
; laufen durch fb_e(); ein hier notiertes &uuml; erschiene beim Leser
; woertlich als "&uuml;".
;
; Attribute in Auszeichnung werden EINFACH quotiert (class='sm-mono'). Ein
; zweites doppeltes Anfuehrungszeichen beendet den Wert vorzeitig - je nach
; Lesemodus abgeschnitten oder die ganze Datei abgewiesen, und beides still.
; Anfuehrungen im Text sind deshalb typografisch: „so“.
;
; Pruefbar mit:  python3 Werkzeuge/ini_pruefen.py <Pluginordner>

[REITER]
EINSTELLUNGEN = "Einstellungen"
LOXONE = "Einbindung in Loxone"
