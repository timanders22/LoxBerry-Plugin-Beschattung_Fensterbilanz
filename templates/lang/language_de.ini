OHNE_HORIZONT = "kein Horizont hinterlegt"
ORT_ERKLAERUNG = "Der Sonnenstand wird gerechnet, nicht abgefragt — es braucht dafür keinen Dienst und keine Internetverbindung, nur den Ort. Die Genauigkeit liegt bei einem Hundertstel Grad; geeicht gegen eine zweite, unabhängige Rechnung nach dem PSA-Algorithmus."
PV_ERKLAERUNG = "<b>Keine zweite Wetterquelle</b> — der gerechnete Wert bleibt der gemessene. Verglichen werden nur die Tagessummen: weicht die gemeldete Strahlung über Tage systematisch von der Ertragsprognose ab, ist wahrscheinlich der Geber verschmutzt, verschattet oder verstellt. Gewarnt wird, eingegriffen nicht. Eingeschaltet verlangt die Gegenprobe den Messwert <span class='sm-mono'>pv_prognose</span>."
RAEUME_ERKLAERUNG = "Nur nötig, wenn die Tagesbilanz ein Gewicht bekommen soll. Sie entscheidet, ab welcher Wärmemenge ein Raum als voll gilt: was einen Raum aufheizt, hängt an seiner Masse, und die wächst mit der Grundfläche. Aufgeführt sind nur Räume, die auch ein Fenster nennt — eine Fläche für die Garage ändert an keinem Urteil etwas. Das Einlesen der Projektdatei füllt diese Tabelle mit, denn dort stehen die Raumflächen (nicht aber die Fensterflächen)."
RAEUME_HILFE = "Ein <b>leeres Feld</b> heißt „unbekannt“ und ist etwas anderes als eine 0 — dann gilt die angenommene Fläche aus den Modellwerten, und der Begründungssatz sagt „geschätzt“. Wer eine Fläche von Hand einträgt, verliert sie beim nächsten Einlesen der Projektdatei nicht: übernommen wird nur in leere Felder."
RAEUME_KEINE = "Noch kein Fenster nennt einen Raum. Sobald in der Tabelle darüber ein Raumschlüssel steht, erscheint er hier."
