[LOX]
H = "Einbindung in Loxone"
S1 = "<b>Schritt 1 — den Weg festlegen.</b> MQTT ist der Regelweg: das Gateway erzeugt die Namen der virtuellen Eingänge selbst, in Loxone genügt ein passend benannter Eingang. Der HTTP-Weg über den Endpunkt ist die Rückfallebene und liefert dieselben Zahlen in einer Textzeile. Beide dürfen gleichzeitig laufen."
S2_V1 = "<b>Schritt 2 — das Abonnement eintragen.</b> Unter System → MQTT Gateway → Subscriptions die Zeile <span class='sm-mono'>%s/#</span> hinzufügen. Ohne diesen Eintrag kommt am Miniserver nichts an."
S2_V2 = "<b>Schritt 2 — nichts eintragen.</b> Dieses Gateway läuft in Fassung 2: die Themengruppe <span class='sm-mono'>%s</span> erscheint von selbst in den Abonnements, dort werden die Datenpunkte angehakt."
H_MESSWERTE = "Schritt 3 — die Messwerte hereinreichen"
MESSWERTE_TEXT = "<b>Ohne diesen Schritt rechnet das Plugin nichts.</b> Es misst nichts selbst: Strahlung, Außentemperatur, Tagesprognose und die Raumwerte kommen aus dem Miniserver. Dafür wird in Loxone <b>ein virtueller Ausgang</b> angelegt, dessen Befehle die Werte an den Endpunkt schicken. Der Knopf unten erzeugt die fertige Importdatei. In Loxone hängt an jeden dieser Befehle der jeweilige Leitwert; für die Tagesprognose eignet sich die Höchsttemperatur t+0 aus Weather4Loxone, für die Beschattungsgrenze der Parameter <span class='sm-mono'>TShadeHeat</span> des Raumreglers. <b>Wichtig:</b> Loxone sendet einen virtuellen Ausgang nur bei Wertänderung. Eine Größe, die sich stundenlang nicht ändert, gilt hier irgendwann als veraltet — deshalb gehört in Loxone ein zyklischer Impuls dazu oder das Höchstalter entsprechend groß gewählt."
SP_BEFEHL = "Befehl bei EIN"
SP_EINGETROFFEN = "Zuletzt eingetroffen"
VOR_SEKUNDEN = "vor %d s: %s"
NIE_EINGETROFFEN = "noch nie"
OPTIONAL = "freiwillig"
KEINE_RAEUME = "Es ist noch kein Fenster mit Raumwerten eingerichtet — deshalb stehen oben nur die vier allgemeinen Größen."
K_VQ = "Vorlage der Messwert-Ausgänge erzeugen"
H_ADRESSE = "Die Adressen des Endpunkts"
ADRESSE_HILFE = "Diese Adressen sind vollständig und lassen sich unverändert abschreiben — mit Wortzeichen. <b>Wird das Wortzeichen neu gewürfelt, ändern sich alle drei</b>, und die alten Adressen antworten mit HTTP 403. Der Rechnername ist ein Vorschlag: maßgeblich ist der Name, unter dem der Miniserver diesen LoxBerry erreicht."
SP_ZWECK = "Zweck"
