BILD_ERKLAERUNG = "Der Verschattungshorizont wird als Zahlenreihe eingetragen. Ob diese Zahlen zu dem passen, was man aus dem Fenster sieht, sagt einem eine Zahlenreihe nicht — ein Bild in einer Sekunde. Gezeichnet ist der Sonnenbogen von <b>heute</b>, weil das der Tag ist, an dem Sie am Fenster stehen und vergleichen."
BILD_LEGENDE = "Gelb ist die Sonnenbahn von heute, der gelbe Punkt ihr jetziger Stand. Grau ist der eingetragene Horizont — <b>wo die graue Fläche die gelbe Linie überdeckt, fällt keine direkte Sonne auf dieses Fenster</b>. Der grüne Streifen ist der Bereich, den ein senkrechtes Fenster überhaupt sehen kann; die gestrichelte Linie ist seine Richtung."
