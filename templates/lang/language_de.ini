R_ERGEBNIS = "Für %s gerechnet: das Hindernis überragt Ihr Fenster um %.2f m, die Mitte ist %.1f m entfernt. Daraus werden %.1f Grad in der Mitte und %.1f Grad an der Kante — die Kante steht weiter weg und wirkt deshalb flacher.<br><b>Einzutragen:</b> <span class='sm-mono'>%s</span><br>Die beiden äußeren Punkte mit :0 sagen „hier hört es auf“. Prüfen Sie das Ergebnis am Bild „Sonnenbahn und Horizont“ weiter unten."
R_ERKLAERUNG = "Sie müssen nichts umrechnen. Sehen Sie sich Ihr Grundstück von oben an — eine Landkarte oder ein Luftbild genügt — und messen Sie <b>zwei Strecken in der Draufsicht</b>: wie weit das Hindernis <b>geradeaus</b> vom Fenster weg steht, und wie weit es <b>seitlich</b> daneben liegt. Dazu die Höhe und die Breite. Der Rechner macht daraus die Stützpunkte samt der beiden Randpunkte, die man von Hand am ehesten vergisst. <b>Mehrere Hindernisse:</b> einfach nacheinander rechnen und anhängen lassen."
