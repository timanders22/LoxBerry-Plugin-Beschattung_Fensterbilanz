PV_ERKLAERUNG = "<b>Keine zweite Wetterquelle</b> — der gerechnete Wert bleibt der gemessene. Verglichen werden nur die Tagessummen: weicht die gemeldete Strahlung über Tage systematisch von der Ertragsprognose ab, ist wahrscheinlich der Geber verschmutzt, verschattet oder verstellt. Gewarnt wird, eingegriffen nicht. Eingeschaltet verlangt die Gegenprobe den Messwert <span class='sm-mono'>pv_prognose</span>."
