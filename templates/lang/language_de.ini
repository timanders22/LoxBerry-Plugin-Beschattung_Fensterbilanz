ORT_ERKLAERUNG = "Der Sonnenstand wird gerechnet, nicht abgefragt — es braucht dafür keinen Dienst und keine Internetverbindung, nur den Ort. Die Genauigkeit liegt bei einem Hundertstel Grad; geeicht gegen eine zweite, unabhängige Rechnung nach dem PSA-Algorithmus."
