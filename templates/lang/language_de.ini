L_AKTIV = "Aktiv"
FELDER_HILFE = "<b>Kürzel</b> — Buchstaben, Ziffern und Unterstrich. Daraus entstehen der Titel des virtuellen Eingangs (<span class='sm-mono'>FB_KUERZEL_URTEIL</span>) und der MQTT-Zweig. <b>Richtung</b> — Grad von Nord im Uhrzeigersinn, genau wie der Parameter <span class='sm-mono'>Dir</span> des AutoJalousie-Bausteins: 0 = Nord, 90 = Ost, 180 = Süd, 270 = West. Die Werte lassen sich unverändert aus der Projektdatei übernehmen. <b>Neigung</b> — 90 für ein senkrechtes Fenster, 0 für ein waagerechtes Dachfenster. <b>Glasfläche</b> — in Quadratmetern, je Fenster. Gemeint ist die <b>Glasfläche</b>, nicht das Mauerloch: Breite mal Höhe der Scheibe, bei einem Standardfenster rund 90 Prozent des Rohbaumaßes. Sie geht <b>nicht</b> in das Urteil ein — ein kleines und ein großes Südfenster wollen zur selben Zeit dasselbe. Sie bestimmt aber jede Wattzahl, jede Wattstunde und damit die gemessene Aufheizkonstante; und sobald die Tagesbilanz ein Gewicht hat, wirkt sie über den Tag doch auf das Urteil. <b>g-Wert</b> — Gesamtenergiedurchlassgrad der Verglasung in Prozent, bei üblichem Zweischeibenglas 55 bis 65, bei Sonnenschutzglas deutlich weniger. <b>Raumschlüssel</b> — Kleinbuchstaben; unter diesem Namen liefert Loxone die Werte <span class='sm-mono'>ist.&lt;schlüssel&gt;</span> und <span class='sm-mono'>grenze.&lt;schlüssel&gt;</span>. Mehrere Fenster dürfen denselben Raum nennen. <b>Trägheit</b> — Zehntelkelvin, um die die Beschattungsgrenze angehoben wird; ein massives Zimmer verträgt eine Stunde Sonne, ein Dachzimmer nicht. <b>Verschattungshorizont</b> — Stützpunkte der Form <span class='sm-mono'>80:22, 110:14, 160:6</span>, gelesen als „ab Azimut 80 Grad steht ein Hindernis 22 Grad hoch“. Zwischen den Punkten wird linear geradeaus gerechnet, außerhalb gilt der jeweils nächste Punkt. Steht die Sonne unter dem Hindernis, fällt der direkte Anteil weg — das Himmelslicht bleibt."
FLAECHE_VORGABE = "Bei %d Fenster(n) steht noch die Vorgabe für die Glasfläche: %s. Das Urteil stimmt trotzdem — es hängt nicht an der Fläche. Falsch werden die Wattzahlen, die Tagesbilanz und die gemessene Aufheizkonstante."
H_RAEUME = "Die Grundflächen der Räume"
RAEUME_ERKLAERUNG = "Nur nötig, wenn die Tagesbilanz ein Gewicht bekommen soll. Sie entscheidet, ab welcher Wärmemenge ein Raum als voll gilt: was einen Raum aufheizt, hängt an seiner Masse, und die wächst mit der Grundfläche. Aufgeführt sind nur Räume, die auch ein Fenster nennt — eine Fläche für die Garage ändert an keinem Urteil etwas. Das Einlesen der Projektdatei füllt diese Tabelle mit, denn dort stehen die Raumflächen (nicht aber die Fensterflächen)."
