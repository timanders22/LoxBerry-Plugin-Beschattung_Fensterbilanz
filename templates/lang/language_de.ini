TEILWEISE = "Gespeichert wurde alles, was in Ordnung war. Die beanstandeten Felder behalten ihren bisherigen Wert."
BEANSTANDUNG = "Bitte diese Punkte richtigstellen:"
ERGAENZT = "Die Konfiguration war unvollständig und wurde einmalig ergänzt: %s. Ab jetzt bedeutet ein fehlender Schlüssel nicht mehr stillschweigend den Vorgabewert."
JA = "ja"
NEIN = "nein"
UNBEKANNT = "nicht feststellbar"
LETZTER_LAUF = "Letzter Lauf"
MINUTEN_HER = "Minuten her"
NIE = "noch nie gerechnet"
FENSTER = "Fenster"
EINGERICHTET = "eingerichtet"
BESCHATTEN = "Beschatten"
GERADE = "wollen gerade Beschattung"
SONNE = "Sonnenhöhe"
AZIMUT = "Azimut %d Grad"
STRAHLUNG = "Strahlung"
SAISON = "Jahreszeit"
SAISON_HILFE = "+100 = der Tag will Wärme, −100 = der Tag will keine"

[FEHLER]
KEINE_ZAHL = "%s: „%s“ ist keine Zahl. Der bisherige Wert bleibt stehen."
AUSSERHALB = "%s: %s liegt außerhalb von %s bis %s. Der bisherige Wert bleibt stehen."
KUERZEL_FEHLT = "Fenster %d: Es sind Angaben eingetragen, aber kein Kürzel. Ohne Kürzel gibt es weder einen virtuellen Eingang noch ein MQTT-Thema, und die Zeile wird nicht gerechnet."
KUERZEL_GEAENDERT = "Fenster %d: Aus dem Kürzel „%s“ wurde „%s“. Erlaubt sind nur Buchstaben, Ziffern und der Unterstrich, weil daraus der Titel eines virtuellen Eingangs und ein MQTT-Zweig wird. Bitte prüfen, ob das gemeint war."
KUERZEL_DOPPELT = "Fenster %d: Das Kürzel „%s“ steht schon in Zeile %d. Zwei gleiche Kürzel ergäben zwei virtuelle Eingänge mit demselben Titel und zwei MQTT-Themen, die einander überschreiben — lautlos. Deshalb wurde nichts gespeichert."
RAUM_FEHLT = "Fenster %d: Die Raumwerte sind eingeschaltet, aber es ist kein Raumschlüssel eingetragen. Ohne ihn weiß das Plugin nicht, welche Temperatur zu diesem Fenster gehört."
RAUM_GEAENDERT = "Fenster %d: der Raumschlüssel wurde von „%s“ zu „%s“ vereinfacht. Erlaubt sind Kleinbuchstaben, Ziffern und Unterstrich. Wichtig: in Loxone müssen die Messwerte unter dem NEUEN Namen hereinkommen — also ist.%3$s und grenze.%3$s."
HORIZONT = "Fenster %d: der Verschattungshorizont ist an dieser Stelle nicht lesbar: %s. Erwartet werden Wertepaare der Form 80:22, 110:14 — Azimut in Grad, Doppelpunkt, Hindernishöhe in Grad, getrennt durch Komma. Die unlesbaren Stellen bleiben unberücksichtigt."
SCHWELLEN = "Die Ausschaltschwelle (%d) muss KLEINER sein als die Einschaltschwelle (%d). Sonst gibt es keine Hysterese, sondern ein Flattern am Schwellwert — der Rollladen führe im Minutentakt auf und ab."
GEWICHTE_NULL = "Beide Gewichte stehen auf 0. Dann gäbe es keinen Wärmebedarf mehr und jedes Urteil wäre 0. Mindestens eines muss größer als 0 sein."
THEMA = "Das MQTT-Thema „%s“ enthält unerlaubte Zeichen. Erlaubt sind Kleinbuchstaben, Ziffern, Bindestrich, Unterstrich und der Schrägstrich. Die Platzhalter + und # sind Suchmuster und als Ziel unbrauchbar."
SPEICHERN = "Die Einstellungen konnten nicht geschrieben werden. Bitte die Rechte am Ordner config/plugins prüfen."
FREMDES_FORMULAR = "Dieses Formular trug kein gültiges Merkmal und wurde abgewiesen. Das schützt davor, dass eine fremde Seite im Hintergrund Ihr Wortzeichen neu würfelt oder das Protokoll leert. Bitte die Seite neu laden und den Vorgang wiederholen."
MODELL = "Das Himmelsmodell „%s“ gibt es nicht. Erlaubt sind isotrop und hdkr."

[LEGENDE]
LESEN = "Grün fragt nur ab und verändert nichts."
TECHNIK = "Grau zeigt Technisches zum Nachsehen."
TECHNIK_XML = "Grau lädt die Vorlagendatei herunter."
AKTION_SPEICHERN = "Orange speichert und rechnet sofort neu."
AKTION_TOKEN = "Orange würfelt das Wortzeichen neu — alle bisherigen Adressen in Loxone werden damit ungültig."
AKTION_LOG = "Orange löscht das Protokoll."
AKTION_RECHNEN = "Orange rechnet sofort neu und sendet die Werte an das MQTT-Gateway."
LESEN_PROJEKT = "Grün liest die Projektdatei und schlägt vor — gespeichert wird dabei nichts."
AKTION_PROJEKT = "Orange trägt die Vorschläge in leere Fensterzeilen ein."
LESEN_WASWARE = "Grün rechnet mit den Probewerten und schreibt nichts."

[TAB]
KUERZEL = "Kürzel"
NAME = "Fenster"
URTEIL = "Urteil"
BESCHATTEN = "Beschatten?"
GRUND = "Grund"
GLAS = "W/m² am Glas"
WATT = "W durchs Glas"
BEGRUENDUNG = "Begründung"
URTEIL30 = "in %d min"
WH = "Wh heute"
BLENDET = "blendet"
DAEMMT = "Nachtdämmung"
NICHT_GEFAHREN = "steht auf %d %% — passt nicht"

[GRUND]
ZU_WENIG_SONNE = "Zu wenig Sonne am Glas — es gibt nichts zu entscheiden"
NICHT_AM_GLAS = "Die Sonne steht nicht an diesem Fenster"
VERSCHATTET = "Vom eingetragenen Horizont verdeckt"
ERWUENSCHT = "Wärme ist erwünscht — Sonne hereinlassen"
RAUM_ZU_WARM = "Der Raum ist über seiner Beschattungsgrenze"
TAG_ZU_WARM = "Der Tag wird zu warm — die Wärme ist Last"
RAUM_UND_TAG = "Raum zu warm UND Tag zu warm"
ABGESCHALTET = "Dieses Fenster ist abgeschaltet"
KEINE_DATEN = "Keine gültigen Messwerte — es wird nicht geraten"
RAUM_VOLL = "Der Raum hat heute schon genug Wärme bekommen"
MORGEN_ZU_WARM = "Morgen wird es zu warm — die Wärme bleibt über Nacht"

[EINST]
AB_WERK = "ab Werk: %s"
BILANZ_ERKLAERUNG = "Nicht die Temperatur, sondern die <b>Wärmemenge</b>. Ein Zimmer, das seit acht Uhr drei Kilowattstunden aufgenommen hat, ist voll — auch wenn das Thermometer noch 24 Grad zeigt, denn die Wand ist warm und gibt das abends wieder ab. Genau diese Größe fehlt einer Momentaufnahme, und genau sie steckt im Namen dieses Plugins. <b>Ab Werk steht das Gewicht auf 0</b>: sehen Sie sich die Wattstunden erst eine Woche lang an, bevor Sie sie ins Urteil lassen."
BILD_ERKLAERUNG = "Der Verschattungshorizont wird als Zahlenreihe eingetragen. Ob diese Zahlen zu dem passen, was man aus dem Fenster sieht, sagt einem eine Zahlenreihe nicht — ein Bild in einer Sekunde. Gezeichnet ist der Sonnenbogen von <b>heute</b>, weil das der Tag ist, an dem Sie am Fenster stehen und vergleichen."
BILD_LEGENDE = "<b>Gelb</b> ist die Sonnenbahn von heute, der gelbe Punkt ihr jetziger Stand. <b>Blassgrün</b> hinterlegt ist der Bereich, den ein senkrechtes Fenster überhaupt sehen kann — die gestrichelte grüne Linie ist seine Blickrichtung. <b>Blaugrau</b> ist der eingetragene Horizont: wo diese Fläche die gelbe Linie überdeckt, fällt keine direkte Sonne auf dieses Fenster.<br><b>Steht in der Überschrift „kein Horizont hinterlegt“, gibt es keine blaugraue Fläche</b> — dann sehen Sie nur das Blassgrün, und das Plugin nimmt für dieses Fenster freie Sicht an. <b>Eingetragen wird der Horizont in der Fenstertabelle weiter oben, in der Spalte „Verschattungshorizont“</b> — oder bequemer mit dem Rechner darunter, der aus Metern die Zahlen macht."
DAEMMEN_ERKLAERUNG = "Ein geschlossener Rollladen ist nachts ein Wärmeschutz — dieselbe Energiebilanz, nur mit umgekehrtem Vorzeichen und ohne Sonne. Verlangt wird dreierlei: die Sonne ist unten, es ist kalt genug, und der Tag <b>will</b> überhaupt Wärme. Der dritte Punkt ist der wichtige: in einer lauen Augustnacht bringt ein geschlossener Rollladen nichts außer einem dunklen Zimmer. <b>Ab Werk aus</b> — sie fährt Rollläden, und das gehört bewusst eingeschaltet. Eingeschaltet verlangt sie den Messwert <span class='sm-mono'>aussen</span>."
FELDER_HILFE = "<b>Kürzel</b> — Buchstaben, Ziffern und Unterstrich. Daraus entstehen der Titel des virtuellen Eingangs (<span class='sm-mono'>FB_KUERZEL_URTEIL</span>) und der MQTT-Zweig. <b>Richtung</b> — Grad von Nord im Uhrzeigersinn, genau wie der Parameter <span class='sm-mono'>Dir</span> des AutoJalousie-Bausteins: 0 = Nord, 90 = Ost, 180 = Süd, 270 = West. Die Werte lassen sich unverändert aus der Projektdatei übernehmen. <b>Neigung</b> — 90 für ein senkrechtes Fenster, 0 für ein waagerechtes Dachfenster. <b>Glasfläche</b> — in Quadratmetern, je Fenster. Gemeint ist die <b>Glasfläche</b>, nicht das Mauerloch: Breite mal Höhe der Scheibe, bei einem Standardfenster rund 90 Prozent des Rohbaumaßes. Sie geht <b>nicht</b> in das Urteil ein — ein kleines und ein großes Südfenster wollen zur selben Zeit dasselbe. Sie bestimmt aber jede Wattzahl, jede Wattstunde und damit die gemessene Aufheizkonstante; und sobald die Tagesbilanz ein Gewicht hat, wirkt sie über den Tag doch auf das Urteil. <b>g-Wert</b> — Gesamtenergiedurchlassgrad der Verglasung in Prozent, bei üblichem Zweischeibenglas 55 bis 65, bei Sonnenschutzglas deutlich weniger. <b>Raumschlüssel</b> — Kleinbuchstaben; unter diesem Namen liefert Loxone die Werte <span class='sm-mono'>ist.&lt;schlüssel&gt;</span> und <span class='sm-mono'>grenze.&lt;schlüssel&gt;</span>. Mehrere Fenster dürfen denselben Raum nennen. <b>Trägheit</b> — Zehntelkelvin, um die die Beschattungsgrenze angehoben wird; ein massives Zimmer verträgt eine Stunde Sonne, ein Dachzimmer nicht. <b>Verschattungshorizont</b> — Stützpunkte der Form <span class='sm-mono'>80:22, 110:14, 160:6</span>, gelesen als „ab Azimut 80 Grad steht ein Hindernis 22 Grad hoch“. Zwischen den Punkten wird linear geradeaus gerechnet, außerhalb gilt der jeweils nächste Punkt. Steht die Sonne unter dem Hindernis, fällt der direkte Anteil weg — das Himmelslicht bleibt."
FENSTER = "Fenster"
FENSTER_ERKLAERUNG = "Je Fenster eine Zeile. <b>Gezählt wird nach der Zeilennummer</b>, nicht nach den belegten Zeilen — eine Zeile darf also leer bleiben, ohne dass sich die Nummern dahinter verschieben. Eine Zeile ohne Kürzel wird übergangen."
FLAECHE_VORGABE = "Bei %d Fenster(n) steht noch die Vorgabe für die Glasfläche: %s. Das Urteil stimmt trotzdem — es hängt nicht an der Fläche. Falsch werden die Wattzahlen, die Tagesbilanz und die gemessene Aufheizkonstante."
GELEERT = "%d Fensterzeile(n) geleert: %s. Eine geleerte Zeile sieht aus wie eine unbenutzte — Richtung 180, Neigung 90, Fläche 1,5 und g-Wert 60 sind die Vorgaben, kein Inhalt. Ohne Kürzel wird die Zeile übergangen. Die Nummern der übrigen Zeilen bleiben, wie sie waren; mit dem Knopf darunter lassen sich die Lücken schließen."
H_ALBEDO = "Wie viel Sonne der Boden vor dem Fenster zurückwirft — Gras und dunkle Erde etwa 20, heller Kies oder Beton 30 bis 40, frischer Schnee bis 80. Der Wert wirkt nur auf senkrechte Fenster und dort schwach; im Zweifel bei 20 lassen. <b>Schnee ist die Ausnahme:</b> ein weißer Garten kann im Februar spürbar mehr Licht ins Zimmer werfen, als man erwartet."
H_BERICHT = "Tagesbericht"
H_BERICHT_STUNDE = "Wann der Tagesbericht geschrieben wird. Er gehört an das Ende des Sonnentages, aber vor Mitternacht — 22 Uhr passt das ganze Jahr. Der Bericht steht danach im Reiter Test und, wenn MQTT läuft, unter <span class='sm-mono'>&lt;präfix&gt;/bericht</span>."
H_BILANZ = "Tagesbilanz je Raum"
H_BILANZ_VOLL = "Bei 0 Wh ist der Bilanzteil +1 (nimm ruhig), beim Erreichen der Schwelle −1 (genug). <b>Die Schwelle wird mit der Grundfläche des Raumes multipliziert</b> — 150 Wh/m² sind für ein 5-m²-Bad 750 Wh und für ein 25-m²-Wohnzimmer 3750 Wh. Eine feste Zahl je Raum wäre für das kleine Bad viel zu hoch und für das große Zimmer zu niedrig, denn was einen Raum aufheizt, hängt an seiner Masse. Ein brauchbarer Anhalt: die Wärmemenge, die den Raum an einem klaren Tag um zwei bis drei Kelvin anhebt. Die Tabelle darunter zeigt je Raum, welche Wattstundenzahl daraus wird."
H_BILD = "Sonnenbahn und Horizont"
H_BREITE = "Geografische Breite Ihres Hauses in Grad, nördlich positiv. München liegt bei 48,1, Hamburg bei 53,6, Zürich bei 47,4. Auf zwei Nachkommastellen genau genügt: 0,01 Grad sind gut einen Kilometer, und der verschiebt den Sonnenaufgang um wenige Sekunden. Den Wert liefert jede Landkarten-App, wenn Sie lange auf Ihr Haus tippen."
H_DAEMMEN = "Nachtdämmung"
H_DAEMMEN_EIN = "Schaltet die Nachtdämmung ein: das Plugin meldet dann, wenn ein geschlossener Rollladen nachts Wärme spart. <b>Ab Werk aus</b>, denn diese Meldung fährt Rollläden, und das gehört bewusst eingeschaltet. Sie braucht den Messwert <span class='sm-mono'>aussen</span> aus Loxone — fehlt er, wird nichts gemeldet."
H_DAEMM_GRENZE = "Unter welcher Außentemperatur die Nachtdämmung überhaupt lohnt. Bei 5 Grad heißt das: nur in kalten Nächten. <b>Höher setzen bringt wenig</b> — in einer lauen Augustnacht spart ein geschlossener Rollladen nichts und macht nur das Zimmer dunkel. Wer sehr schlecht gedämmte Fenster hat, kann auf 10 gehen."
H_E_REF = "Ab diesem Wert zählt das Urteil in voller Höhe, darunter anteilig weniger. <b>Gewogen wird der DIREKTE Anteil</b>, nicht die gesamte Strahlung am Glas. Grund: Himmelslicht und Bodenreflex stehen an jedem Fenster, den ganzen Tag, und sind überall fast gleich groß — am 23.08.2026 waren das 121 W/m². Zählte man sie mit, verlangten auch die Nordfenster Beschattung, auf die gar keine Sonne fällt. Angezeigt werden in der Tabelle trotzdem die vollen Werte; nur das Gewicht des Urteils hängt am direkten Teil."
H_FENSTER = "Die Fenster"
H_GEWICHTE = "Die beiden Teile werden gewichtet addiert, nicht verundet. Ein UND ließe den Raum die Jahreszeit überstimmen — dann wäre im September alles zu; ein ODER umgekehrt — dann bliebe im August alles offen. Die Summe muss nicht genau 100 ergeben, es wird ohnehin auf die Summe bezogen. <b>Eine harte Obergrenze gibt es trotzdem:</b> ein Raum über seiner Beschattungsgrenze bekommt nie ein positives Urteil."
H_GEWICHT_BILANZ = "<b>Steht ab Werk auf 0, also aus.</b> Das ist Absicht: sehen Sie sich die Wattstunden erst eine Woche lang an, bevor Sie sie mitentscheiden lassen.<br><b>Wo Sie sie sehen:</b> im Reiter Test der Knopf „Tagesbilanz“ — dort steht je Fenster und je Raum, wie viel heute schon hereingekommen ist. Außerdem in der Statuszeile als <span class='sm-mono'>WH_TAG</span> und in Loxone je Fenster als <span class='sm-mono'>FB_&lt;kürzel&gt;_WH</span>.<br><b>Wenn Sie ihn einschalten wollen: 20 ist ein guter Anfang</b>, 30 für ein Haus, das sich über den Tag deutlich aufheizt. Die Gewichte werden gegeneinander verrechnet — gibt man dem Bilanzteil 20, zählen Raum und Tag entsprechend weniger. Mehr als 40 dreht das Verhalten spürbar um: dann entscheidet die Wärmemenge des Tages und nicht mehr die Temperatur."
H_GEWICHT_MORGEN = "<b>Steht ab Werk auf 0, also aus.</b> Er greift nur am Spätnachmittag, ab der Stunde darunter, und beantwortet eine einzige Frage: <b>wird morgen wärmer oder kühler als heute?</b> Wird es kühler, darf die letzte Sonnenstunde heute noch herein — die Wärme wird über Nacht nicht zur Last. Wird es heißer, ist jedes Watt von heute Abend eines zu viel, weil das Haus über Nacht nicht mehr auskühlt.<br><b>Vorschlag: 10 bis 15.</b> Das ist bewusst wenig — der Teil soll den Abend abrunden, nicht den Tag bestimmen. Er braucht den Messwert <span class='sm-mono'>prognose1</span> (Tageshöchstwert von morgen) aus Loxone; ohne ihn wird ab dieser Stunde gar nicht mehr gerechnet, also erst die Vorlage einlesen, dann das Gewicht setzen."
H_GEWICHT_RAUM = "Wie stark die <b>aktuelle Raumtemperatur</b> mitentscheidet. Hoch heißt: was das Thermometer im Zimmer sagt, gibt den Ton an — das Haus reagiert schnell, aber kurzsichtig. Niedrig heißt: die Jahreszeit entscheidet. Die Gewichte werden gegeneinander verrechnet, es muss also keine 100 herauskommen. 40 zu 60 heißt: der Tag wiegt etwas schwerer als der Augenblick."
H_GLAETTUNG = "Der Klarheitsindex springt bei durchziehenden Wolken erheblich. Über diese Spanne wird die Strahlung gemittelt, <b>bevor</b> irgendetwas mit ihr gerechnet wird — eine einzelne Wolke soll die Rechnung nicht durcheinanderbringen, ein echter Wetterwechsel aber ankommen. Das ist etwas anderes als die Hysterese weiter oben: die verhindert das Flattern an der Schwelle, dies das Flattern der Messgröße."
H_HIMMELSMODELL = "Das isotrope Modell verteilt die Diffusstrahlung gleichmäßig über den Himmel. Bei klarem Himmel ist sie in Sonnennähe aber deutlich stärker; HDKR trägt dem Rechnung und liefert an sonnenzugewandten Fenstern rund fünf bis zehn Prozent mehr. <b>Es lohnt erst, wenn die Aufheizkonstante gemessen ist</b> — vorher vergleicht man Modell gegen Modell. Prüfbar ist HDKR daran, dass es bei bedecktem Himmel genau in das isotrope Modell übergeht."
H_HOECHSTALTER = "Ein Messwert, der älter ist, gilt als nicht vorhanden — und dann wird nicht geraten, sondern <span class='sm-mono'>FB_OK</span> auf 0 gesetzt. Der Wert muss größer sein als der Abstand, in dem Loxone die Werte schickt. Bei einer Tagesprognose, die sich stündlich ändert, sind 900 Sekunden zu knapp; dann gehört in Loxone ein zyklisches Senden dazu."
H_IAM = "Der Beiwert beschreibt, wie stark das Glas bei schrägem Einfall spiegelt (ASHRAE: <span class='sm-mono'>1 − b0 · (1/cos θ − 1)</span>). 10 entspricht b0 = 0,10 und passt für klares Zweischeibenglas. Größer heißt: das Glas riegelt bei streifendem Einfall früher ab."
H_LAGE = "Wie es gerade steht"
H_LERNEN = "Schreibt je Tag und Raum ein Wertepaar mit: gerechneter Wärmeeintrag in Wh gegen die gemessene Temperaturspanne des Tages. Daraus entsteht über eine Saison die Zahl, an der sich alles Übrige eichen lässt — <b>Kelvin je Kilowattstunde, an dieser Anlage gemessen statt aus einem Modell</b>. Das Sammeln greift nie ins Urteil ein."
H_MODELL = "Das Modell"
H_MQTT_EIN = "Schickt alle Werte zusätzlich über MQTT. <b>Das ist der empfohlene Weg nach Loxone</b>, weil die Werte von selbst ankommen, statt abgeholt werden zu müssen. Braucht ein eingerichtetes MQTT-Gateway auf dem LoxBerry; ob es läuft, sagt der Reiter MQTT. Der HTTP-Weg bleibt davon unberührt."
H_ORT = "Standort"
H_PV = "Gegenprobe gegen die PV-Ertragsprognose"
H_PV_ABWEICHUNG = "Ab welcher Abweichung in Prozent gewarnt wird. 25 ist großzügig und genau richtig: Tageswolken machen leicht zehn bis fünfzehn Prozent Unterschied, ein verschmutzter Geber macht dauerhaft mehr. <b>Zu klein gesetzt warnt das Plugin bei jedem wechselhaften Tag</b> — und eine Warnung, die man wegklickt, ist keine."
H_PV_GEGENPROBE = "Vergleicht die gemeldete Strahlung über Tage mit der Ertragsprognose Ihrer Solaranlage. <b>Das ist keine zweite Wetterquelle</b> — gerechnet wird weiter mit dem gemessenen Wert. Laufen beide auseinander, ist wahrscheinlich der Strahlungsgeber verschmutzt, verschattet oder verstellt. Gewarnt wird, eingegriffen nicht. Braucht den Messwert <span class='sm-mono'>pv_prognose</span>."
H_RAEUME = "Die Grundflächen der Räume"
H_RAUMFLAECHE_VORGABE = "Für jeden Raum, dessen Grundfläche weder eingetragen noch aus der Projektdatei gelesen wurde. <b>Nicht 0:</b> ein Raum ohne Ausdehnung wäre sofort voll, und der Bilanzteil stünde dauerhaft auf −1, ohne dass es jemand bemerkt. Wo geschätzt wird, sagt es der Begründungssatz des Fensters."
H_RECHENTAKT = "Loxone schickt bei einem Wetterwechsel mehrere virtuelle Ausgänge in derselben Sekunde los. Ohne Mindestabstand rechnete das Plugin für jeden davon neu und schickte jedes Mal eine volle MQTT-Salve."
H_SCHWELLEN = "Die beiden Werte bilden eine Hysterese. Ohne sie führe der Rollladen am Schwellwert im Minutentakt auf und ab. Die Ausschaltschwelle muss kleiner sein als die Einschaltschwelle."
H_SCHWELLE_EIN = "Ab welchem Urteil <span class='sm-mono'>BESCHATTEN</span> auf 1 geht. −30 heißt: das Urteil muss deutlich im negativen Bereich liegen. Zusammen mit dem Feld darunter ergibt das eine Hysterese: eingeschaltet wird bei −30, ausgeschaltet erst wieder bei −15. <b>Ohne diesen Abstand flattert der Rollladen</b>, sobald das Urteil um die Schwelle pendelt."
H_SICHERUNG = "Einstellungen sichern und zurückspielen"
H_SPREIZUNG = "Über diese Spanne läuft der jeweilige Teil stetig von +1 (Wärme willkommen) auf −1 (Wärme unerwünscht). Eine kleine Spanne macht das Urteil hart und sprunghaft, eine große weich und träge. 20 Zehntelkelvin sind 2,0 Kelvin."
H_SPREIZUNG_TAG = "Über wie viele Kelvin der Tagesteil von „Wärme willkommen“ auf „Wärme unerwünscht“ umschwenkt. Bei 6 und einer Tagesgrenze von 20 heißt das: 17 Grad erwartet = voll willkommen, 20 = neutral, 23 = voll unerwünscht. <b>Klein macht das Urteil hart und sprunghaft, groß macht es weich und träge.</b> Wer im Frühjahr ständig zwischen beschattet und offen wechselt, erhöht diesen Wert."
H_STELLUNG = "Rückmeldung der Rollladenstellung"
H_STELLUNG_EIN = "Schaltet die Rückmeldung ein: das Plugin vergleicht dann, ob Loxone seine Forderung auch umgesetzt hat. <b>Ab Werk aus</b>, weil es je Fenster einen weiteren virtuellen Ausgang verlangt — Loxone muss die Rollladenstellung als <span class='sm-mono'>stellung.&lt;kürzel&gt;</span> hereinschicken. Genau diese Rückmeldung fehlte an dem Tag, aus dem dieses Plugin entstanden ist."
H_STELLUNG_FRIST = "Ein Rollladen braucht seine Zeit, und der AutoJalousie-Baustein hat seine eigene Einschaltverzögerung. Ohne Frist meldete das Plugin bei jeder Fahrt eine Abweichung."
H_STELLUNG_ZU = "Ab welcher gemeldeten Stellung in Prozent ein Rollladen als „gefahren“ gilt. 70 heißt: mindestens siebzig Prozent geschlossen. Niedriger setzen, wenn Ihre Beschattung nur teilweise fährt und das genügen soll."
H_TAGESGRENZE = "<b>Das ist der wichtigste Wert des ganzen Plugins.</b> Er beantwortet die Frage, an der eine Schaltbedingung in Loxone scheitert: nicht „ist es draußen warm?“, sondern „will das Haus heute Wärme?“. Am 23.08.2026 standen 19,5 Grad draußen und 32,7 Grad im Wohnzimmer — die Außenluft hätte „hereinlassen“ gesagt, der Tag wurde 28 Grad. Nicht zu verwechseln mit der Heizgrenztemperatur der Bauphysik (üblich 15 Grad): die bezieht sich auf das Tagesmittel, hier steht der Höchstwert, und der liegt in der Übergangszeit rund 5 Kelvin darüber."
H_VORABEND = "Vorabend: die Prognose für morgen"
H_VORABEND_AB = "Ab welcher Uhrzeit der Vorabendteil überhaupt mitzählt. Vorher ist die Frage „wird morgen wärmer?“ ohne Belang — bis zum Abend hat der heutige Tag noch reichlich Zeit. 16 Uhr ist ein brauchbarer Anfang; im Hochsommer darf es auch 17 sein."
H_VORSCHAU = "Vorausschau"
KEIN_STANDORT = "<b>Es ist kein Standort eingetragen.</b> Ohne geografische Breite und Länge gibt es keinen Sonnenstand und damit kein Urteil. Der Standort steht in der Loxone-Projektdatei im Abschnitt <span class='sm-mono'>Document</span>."
K_LUECKEN = "Lücken schließen — Zeilen nach oben rücken"
