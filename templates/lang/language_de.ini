H_VORABEND = "Vorabend: die Prognose für morgen"
VORABEND_ERKLAERUNG = "Am Vormittag sagt die Prognose für morgen nichts darüber, ob diese Sonne jetzt erwünscht ist — das Haus hat bis dahin eine Nacht Zeit. Am späten Nachmittag dagegen bleibt die Wärme bis morgen früh im Haus: wird es kühler, ist sie willkommen; wird es heißer, ist sie eine Last, weil das Haus über Nacht nicht mehr auskühlt. <b>Ab Werk aus.</b> Eingeschaltet verlangt dieser Teil den Messwert <span class='sm-mono'>prognose1</span>."
L_GEWICHT_MORGEN = "Gewicht des Vorabendteils in Prozent"
L_VORABEND_AB = "Greift ab Stunde"
H_DAEMMEN = "Nachtdämmung"
DAEMMEN_ERKLAERUNG = "Ein geschlossener Rollladen ist nachts ein Wärmeschutz — dieselbe Energiebilanz, nur mit umgekehrtem Vorzeichen und ohne Sonne. Verlangt wird dreierlei: die Sonne ist unten, es ist kalt genug, und der Tag <b>will</b> überhaupt Wärme. Der dritte Punkt ist der wichtige: in einer lauen Augustnacht bringt ein geschlossener Rollladen nichts außer einem dunklen Zimmer. <b>Ab Werk aus</b> — sie fährt Rollläden, und das gehört bewusst eingeschaltet. Eingeschaltet verlangt sie den Messwert <span class='sm-mono'>aussen</span>."
