[LOX]
H = "Einbindung in Loxone"
S1 = "<b>Schritt 1 — den Weg festlegen.</b> MQTT ist der Regelweg: das Gateway erzeugt die Namen der virtuellen Eingänge selbst, in Loxone genügt ein passend benannter Eingang. Der HTTP-Weg über den Endpunkt ist die Rückfallebene und liefert dieselben Zahlen in einer Textzeile. Beide dürfen gleichzeitig laufen."
S2_V1 = "<b>Schritt 2 — das Abonnement eintragen.</b> Unter System → MQTT Gateway → Subscriptions die Zeile <span class='sm-mono'>%s/#</span> hinzufügen. Ohne diesen Eintrag kommt am Miniserver nichts an."
S2_V2 = "<b>Schritt 2 — nichts eintragen.</b> Dieses Gateway läuft in Fassung 2: die Themengruppe <span class='sm-mono'>%s</span> erscheint von selbst in den Abonnements, dort werden die Datenpunkte angehakt."
H_MESSWERTE = "Schritt 3 — die Messwerte hereinreichen"
MESSWERTE_TEXT = "<b>Ohne diesen Schritt rechnet das Plugin nichts.</b> Es misst nichts selbst: Strahlung, Außentemperatur, Tagesprognose und die Raumwerte kommen aus dem Miniserver. Dafür wird in Loxone <b>ein virtueller Ausgang</b> angelegt, dessen Befehle die Werte an den Endpunkt schicken. Der Knopf unten erzeugt die fertige Importdatei. In Loxone hängt an jeden dieser Befehle der jeweilige Leitwert; für die Tagesprognose eignet sich die Höchsttemperatur t+0 aus Weather4Loxone, für die Beschattungsgrenze der Parameter <span class='sm-mono'>TShadeHeat</span> des Raumreglers. <b>Wichtig:</b> Loxone sendet einen virtuellen Ausgang nur bei Wertänderung. Eine Größe, die sich stundenlang nicht ändert, gilt hier irgendwann als veraltet — deshalb gehört in Loxone ein zyklischer Impuls dazu oder das Höchstalter entsprechend groß gewählt."
SP_BEFEHL = "Befehl bei EIN"
SP_EINGETROFFEN = "Zuletzt eingetroffen"
VOR_SEKUNDEN = "vor %d s: %s"
NIE_EINGETROFFEN = "noch nie"
OPTIONAL = "freiwillig"
KEINE_RAEUME = "Es ist noch kein Fenster mit Raumwerten eingerichtet — deshalb stehen oben nur die vier allgemeinen Größen."
K_VQ = "Vorlage der Messwert-Ausgänge erzeugen"
H_ADRESSE = "Die Adressen des Endpunkts"
ADRESSE_HILFE = "Diese Adressen sind vollständig und lassen sich unverändert abschreiben — mit Wortzeichen. <b>Wird das Wortzeichen neu gewürfelt, ändern sich alle drei</b>, und die alten Adressen antworten mit HTTP 403. Der Rechnername ist ein Vorschlag: maßgeblich ist der Name, unter dem der Miniserver diesen LoxBerry erreicht."
SP_ZWECK = "Zweck"
SP_ADRESSE = "Adresse"
Z_STATUS = "Alle Werte als Textzeilen (das ist die Adresse der Eingangs-Vorlage)"
Z_JSON = "Dasselbe als JSON, mit der Begründung je Fenster"
Z_SELFTEST = "Selbsttest — beantwortet die Tokenfrage, ohne etwas auszulösen"
TOKEN_HINWEIS = "Auch die abfragenden Aufrufe verlangen ein Wortzeichen. Grund: in der Antwort stehen Raumtemperaturen. Das ist kein Betriebsgeheimnis, sagt aber jedem im Heimnetz, ob jemand zu Hause ist."
H_FELDER = "Schritt 4 — die virtuellen Eingänge"
FELDER_HILFE = "Je Fenster vier Werte, dazu neun Summenwerte. <b>Minimum und Maximum sind kein Schmuck:</b> Loxone kappt einen Wert auf die Grenzen des virtuellen Eingangs, und zwar still. Ein Urteil mit Minimum 0 käme von jedem zu beschattenden Fenster als 0 an — also genau als der Wert, der „keine Meinung“ bedeutet."
SP_TITEL = "Titel"
SP_EINHEIT = "Einheit"
SP_BEREICH = "Min … Max"
SP_BEDEUTUNG = "Bedeutung"
KEINE_FENSTER = "Es ist noch kein Fenster eingerichtet. Die Vorlage enthielte dann nur die Summenwerte."
H_ALLES = "Alles auf einmal anlegen"
ALLES_TEXT = "Der Knopf erzeugt eine Importdatei für Loxone Config mit allen virtuellen Eingängen samt Titel, Kommentar, Einheit und Grenzen. In Loxone Config über <b>Datei → Vorlage importieren</b> einlesen. <b>Loxone Config legt beim Import neu an und überschreibt nichts</b> — zweimal importiert heißt doppelte Objekte."
K_VI = "Vorlage für Loxone Config erzeugen"
FEHLER_VORLAGE = "Die Vorlage konnte nicht erzeugt werden. Ist wenigstens ein Fenster eingerichtet?"
H_AUSFALL = "Schritt 5 — Ausfallerkennung"
AUSFALL_TEXT = "Virtuelle Eingänge behalten ihren letzten Wert. Steht das Plugin, sieht in der App alles normal aus — die Rollläden stünden für immer so, wie sie zuletzt standen. Dagegen gibt es zwei Werte: <span class='sm-mono'>FB_HERZ</span> zählt die Minuten seit dem letzten Lauf und steht auf <b>−1</b>, solange noch nie gerechnet wurde; <span class='sm-mono'>FB_OK</span> steht auf 0, sobald ein Messwert fehlt oder veraltet ist. <b>Beides gehört in Loxone ausgewertet</b>, und zwar so, dass bei einem Ausfall die eigene Freigabe des AutoJalousie wieder greift. Das Plugin selbst fällt in diesem Fall auf „keine Meinung“ zurück: Urteil 0, Beschatten 0."
H_BAUSTEINE = "Schritt 6 — die Bausteine zum Nachbauen"
BAUSTEINE = "<table class='sm-tbl'><tr><th>#</th><th>Baustein (Typ)</th><th>Name (Vorschlag)</th><th>Parameter</th><th>Eingänge verbinden mit</th></tr><tr><td>1</td><td>Statusbaustein</td><td>Fensterbilanz gültig</td><td>—</td><td><span class='sm-mono'>FB_OK</span></td></tr><tr><td>2</td><td>Analogwert-Vergleicher</td><td>Fensterbilanz steht</td><td>größer als 15, Einschaltverzögerung 300 s</td><td><span class='sm-mono'>FB_HERZ</span></td></tr><tr><td>3</td><td>ODER</td><td>Fensterbilanz unbrauchbar</td><td>—</td><td>Ausgang von #2 und der invertierte <span class='sm-mono'>FB_OK</span></td></tr><tr><td>4</td><td>Benachrichtigungsbaustein (optional)</td><td>Meldung Fensterbilanz</td><td>Betreff und Text frei</td><td>#3 — und <b>nur</b> #3</td></tr><tr><td>5</td><td>ODER</td><td>Freigabe Beschattung je Fenster</td><td>je Fenster einer</td><td><span class='sm-mono'>FB_&lt;kuerzel&gt;_BESCHATTEN</span> und der bisherige Freigabeweg, verundet mit #3</td></tr><tr><td>6</td><td>AutoJalousie</td><td>vorhanden, wird nicht ersetzt</td><td><span class='sm-mono'>Dir</span>, <span class='sm-mono'>DirTol</span>, <span class='sm-mono'>AutoShadeTime</span> bleiben unverändert</td><td>Eingang <span class='sm-mono'>AutoShade</span> ← Ausgang von #5</td></tr><tr><td>7</td><td>Statistik</td><td>Urteil je Fenster</td><td>Analogwert, Aufzeichnung alle 5 Minuten</td><td><span class='sm-mono'>FB_&lt;kuerzel&gt;_URTEIL</span></td></tr><tr><td>8</td><td>Statistik (optional)</td><td>Eintrag je Fenster</td><td>Analogwert in Watt</td><td><span class='sm-mono'>FB_&lt;kuerzel&gt;_WATT</span></td></tr><tr><td>9</td><td>Statusbaustein (optional)</td><td>Warum beschattet</td><td>Text je Zahl, siehe die Tabelle im Reiter MQTT</td><td><span class='sm-mono'>FB_&lt;kuerzel&gt;_GRUND</span></td></tr><tr><td>10</td><td>Virtueller Ausgang</td><td>Fensterbilanz Messwerte</td><td>aus der Vorlage in Schritt 3</td><td>Leitwerte für Strahlung, Außentemperatur, Prognose und je Raum Ist und Grenze</td></tr></table>"
BAUSTEINE_ERL = "<b>Zu #2:</b> Die Schwelle liegt bei 15 Minuten, also beim Dreifachen des Cron-Takts. Enger gesetzt meldet sie bei jedem verpassten Durchlauf, und nach der dritten Meldung sieht niemand mehr hin. <b>Zu #3 und #5:</b> Das ist der wichtigste Zusammenhang der ganzen Liste. Das Plugin darf nur dann mitreden, wenn seine Werte gültig sind — sonst muss die bisherige Freigabe allein weitergelten. Wer #5 ohne die Verundung baut, hat bei einem Ausfall des LoxBerry eine Beschattung, die für immer in ihrer letzten Stellung steht. <b>Zu #4:</b> Der Benachrichtigungsbaustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen unmittelbar an seinen Eingang hängen — erst über das ODER zusammenführen, sonst verschluckt eine dauerhaft anstehende Quelle alle übrigen. <b>Zu #6:</b> Der AutoJalousie wird <b>nicht ersetzt</b>. Seine Winkel- und Lamellenrechnung ist gut; was ihm fehlt, ist das Urteil darüber, ob die Wärme erwünscht ist. Genau das liefert dieses Plugin, und nur an <span class='sm-mono'>AutoShade</span>. <b>Zu #7:</b> Die Statistik über das Urteil ist der nützlichste Wert des ganzen Plugins. Wer nach einer Woche hineinsieht, erkennt sofort, ob Tagesgrenze und Gewichte passen — und zwar bevor er sie ändert. <b>Zu #10:</b> Loxone sendet einen virtuellen Ausgang nur bei Wertänderung. Eine Prognose, die sich stundenlang nicht rührt, gilt hier irgendwann als veraltet; ein zyklischer Impuls alle zehn Minuten kostet nichts und erspart die Suche. <b>Loxone-Zeitrechnung:</b> Loxone zählt Sekunden seit dem 01.01.2009. Wer mit <span class='sm-mono'>FB_TS</span> rechnet, zieht von der Loxone-Zeit <span class='sm-mono'>1230768000</span> ab. Alle Bausteine findet Loxone Config über die Baustein-Suche mit <b>F5</b>."
H_GEGENPROBE = "Schritt 7 — die Gegenprobe"
GEGENPROBE_TEXT = "<b>Erstens:</b> im Reiter „Einbindung in Loxone“ die Spalte „Zuletzt eingetroffen“ ansehen. Steht dort bei einer Größe „noch nie“, sendet der virtuelle Ausgang nicht — dann stimmt die Adresse nicht oder das Wortzeichen ist alt. <b>Zweitens:</b> im Reiter Test den Knopf „Selbstprüfung“ drücken. Er beantwortet in einer Liste, ob die Einrichtung trägt. <b>Drittens:</b> in Loxone Config einen der virtuellen Eingänge im Monitor beobachten. Ändert sich <span class='sm-mono'>FB_HERZ</span> im Minutentakt, kommen die Werte an. <b>Viertens, und das ist die eigentliche Probe:</b> im Reiter Test den Knopf „Tagesgang“ drücken. Er zeigt stundenweise, wann die Sonne an welchem Fenster steht. Passt diese Tabelle nicht zu dem, was man am Haus sieht, stimmt eine Himmelsrichtung oder ein Horizont nicht — und das findet man dort in einer Minute statt über eine Saison."
H_TOKEN = "Das Wortzeichen"
TOKEN_TEXT = "Das Wortzeichen schützt den Endpunkt im unangemeldeten Bereich. Ein neues zu würfeln ist harmlos, macht aber <b>alle bisher in Loxone eingetragenen Adressen ungültig</b> — sie antworten danach mit HTTP 403, und zwar sowohl die Eingänge als auch die Ausgänge, über die die Messwerte hereinkommen. Danach beide Vorlagen neu erzeugen und importieren."
K_TOKEN_NEU = "Neues Wortzeichen erzeugen"
TOKEN_NEU_OK = "Ein neues Wortzeichen wurde erzeugt. Bitte beide Vorlagen neu erzeugen und in Loxone einlesen — die alten Adressen antworten ab sofort mit HTTP 403."

