H_BILANZ = "Tagesbilanz je Raum"
BILANZ_ERKLAERUNG = "Nicht die Temperatur, sondern die <b>Wärmemenge</b>. Ein Zimmer, das seit acht Uhr drei Kilowattstunden aufgenommen hat, ist voll — auch wenn das Thermometer noch 24 Grad zeigt, denn die Wand ist warm und gibt das abends wieder ab. Genau diese Größe fehlt einer Momentaufnahme, und genau sie steckt im Namen dieses Plugins. <b>Ab Werk steht das Gewicht auf 0</b>: sehen Sie sich die Wattstunden erst eine Woche lang an, bevor Sie sie ins Urteil lassen."
L_GEWICHT_BILANZ = "Gewicht der Tagesbilanz in Prozent"
L_BILANZ_VOLL = "Ein Raum gilt als voll ab … Wh je m² Grundfläche"
L_RAUMFLAECHE_VORGABE = "Angenommene Grundfläche eines unbekannten Raumes in m²"
H_RAUMFLAECHE_VORGABE = "Für jeden Raum, dessen Grundfläche weder eingetragen noch aus der Projektdatei gelesen wurde. <b>Nicht 0:</b> ein Raum ohne Ausdehnung wäre sofort voll, und der Bilanzteil stünde dauerhaft auf −1, ohne dass es jemand bemerkt. Wo geschätzt wird, sagt es der Begründungssatz des Fensters."
H_BILANZ_VOLL = "Bei 0 Wh ist der Bilanzteil +1 (nimm ruhig), beim Erreichen der Schwelle −1 (genug). <b>Die Schwelle wird mit der Grundfläche des Raumes multipliziert</b> — 150 Wh/m² sind für ein 5-m²-Bad 750 Wh und für ein 25-m²-Wohnzimmer 3750 Wh. Eine feste Zahl je Raum wäre für das kleine Bad viel zu hoch und für das große Zimmer zu niedrig, denn was einen Raum aufheizt, hängt an seiner Masse. Ein brauchbarer Anhalt: die Wärmemenge, die den Raum an einem klaren Tag um zwei bis drei Kelvin anhebt. Die Tabelle darunter zeigt je Raum, welche Wattstundenzahl daraus wird."
L_LERNEN = "Aufheizkonstante je Raum mitschreiben"
