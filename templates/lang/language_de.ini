MESSWERTE_FEHLEN = "<b>Es fehlen gültige Messwerte:</b> %s. Ein Wert gilt nur, solange er jünger ist als %d Sekunden. Solange etwas fehlt, steht <span class='sm-mono'>FB_OK</span> auf 0 und jedes Urteil auf 0 — es wird nichts geraten. Die Werte kommen über die virtuellen Ausgänge herein, siehe Reiter „Einbindung in Loxone“."
