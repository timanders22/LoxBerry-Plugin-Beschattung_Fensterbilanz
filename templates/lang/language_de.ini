MODELL_HDKR = "HDKR — mit Sonnenkranz und Horizontaufhellung"
H_HIMMELSMODELL = "Das isotrope Modell verteilt die Diffusstrahlung gleichmäßig über den Himmel. Bei klarem Himmel ist sie in Sonnennähe aber deutlich stärker; HDKR trägt dem Rechnung und liefert an sonnenzugewandten Fenstern rund fünf bis zehn Prozent mehr. <b>Es lohnt erst, wenn die Aufheizkonstante gemessen ist</b> — vorher vergleicht man Modell gegen Modell. Prüfbar ist HDKR daran, dass es bei bedecktem Himmel genau in das isotrope Modell übergeht."
H_VORSCHAU = "Vorausschau"
