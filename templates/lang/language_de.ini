STELLUNG_ERKLAERUNG = "Das Plugin liefert ein Urteil und sieht sonst nie, was Loxone daraus gemacht hat. <b>Genau daran ist der Vorfall entstanden, aus dem dieses Plugin kommt</b>: fünfzehn Raumregler meldeten Bedarf, gefahren ist keiner, und niemandem ist es aufgefallen. Eingeschaltet erwartet das Plugin je Fenster einen weiteren virtuellen Ausgang <span class='sm-mono'>stellung.&lt;kürzel&gt;</span> mit der Stellung in Prozent und meldet, wenn Forderung und Wirklichkeit auseinanderlaufen."
VORABEND_ERKLAERUNG = "Am Vormittag sagt die Prognose für morgen nichts darüber, ob diese Sonne jetzt erwünscht ist — das Haus hat bis dahin eine Nacht Zeit. Am späten Nachmittag dagegen bleibt die Wärme bis morgen früh im Haus: wird es kühler, ist sie willkommen; wird es heißer, ist sie eine Last, weil das Haus über Nacht nicht mehr auskühlt. <b>Ab Werk aus.</b> Eingeschaltet verlangt dieser Teil den Messwert <span class='sm-mono'>prognose1</span>."
W_BLENDUNG = "Blendschutz — was bedeuten die beiden Zahlen?"
W_BLENDUNG_TEXT = "Die Blendung ist eine <b>eigene Meldung</b> und geht nicht in das Urteil ein: tief stehende Sonne blendet auch im Januar, wenn die Wärme hochwillkommen ist. In Loxone gehört dieser Wert deshalb an einen anderen Eingang als die Wärmefreigabe.<br><br><b>Erste Zahl — bis zu welcher Sonnenhöhe geblendet wird.</b> Gemeint ist der Winkel der Sonne über dem Horizont: 0 Grad ist Sonnenaufgang, 90 Grad wäre senkrecht über Ihnen. Steht die Sonne <b>tiefer</b> als Ihre Zahl, kommt sie flach durchs Fenster und trifft auf Augenhöhe. Sie müssen dafür nichts messen — die Sonnenhöhe rechnet das Plugin selbst. Zur Einordnung, gerechnet für Ihren Standort:<table class='sm-tbl'><tr><th>Tag</th><th>8 Uhr</th><th>12 Uhr</th><th>16 Uhr</th><th>18 Uhr</th></tr><tr><td>21. Juni</td><td>25&#176;</td><td>61&#176;</td><td>49&#176;</td><td>30&#176;</td></tr><tr><td>21. März</td><td>17&#176;</td><td>42&#176;</td><td>23&#176;</td><td>4&#176;</td></tr><tr><td>21. Dezember</td><td>&minus;1&#176;</td><td>18&#176;</td><td>2&#176;</td><td>&minus;15&#176;</td></tr></table><b>Brauchbare Werte:</b> 25 für einen Arbeitsplatz am Fenster, 20 für einen Wohnraum, 15 für „nur bei ganz flacher Sonne“. <b>0 schaltet die Blendmeldung ab.</b> Beachten Sie die letzte Zeile: im Dezember steigt die Sonne hier nie über 18 Grad — mit einer 20 meldet ein Südfenster dann den ganzen Tag Blendung. Das kann gewollt sein; überraschen sollte es nicht.<br><br><b>Zweite Zahl — wie schräg die Sonne noch stehen darf.</b> Der Winkel zwischen der Sonne und der Blickrichtung des Fensters, gemessen von der Senkrechten auf die Scheibe: 0 Grad heißt „die Sonne steht genau vor dem Fenster“, 90 Grad hieße „sie streift die Scheibe von der Seite“. Nur wenn die Sonne <b>enger</b> als Ihre Zahl steht, scheint sie in den Raum hinein statt daran vorbei. Auch das rechnet das Plugin selbst. <b>Brauchbar sind 40 Grad</b>; 30 meldet nur bei ziemlich frontaler Sonne, 60 fast immer, wenn die Sonne überhaupt auf dieser Seite steht.<br><br>Geblendet wird nur gemeldet, wenn <b>beides</b> zutrifft und die Sonne nicht ohnehin hinter dem eingetragenen Horizont steht."
W_DACH = "Dachüberstand, Vordach, Balkon — drei Zahlen mit dem Zollstock"
W_DACH_TEXT = "<b>Warum das nicht in den Verschattungshorizont gehört:</b> der Horizont nimmt die Sonne weg, wenn sie <b>tief</b> steht — Nachbarhaus, Baum. Ein Dachüberstand macht das Gegenteil: er hält die <b>hohe</b> Sommersonne draußen und lässt die flache Wintersonne herein. Genau dafür baut man ihn. Beides in dieselbe Zahlenreihe zu schreiben ginge nicht; man trüge die Verschattung genau falsch herum ein.<br><br><b>Drei Zahlen, alle in Zentimetern:</b><ul><li><b>Auskragung</b> — wie weit ragt der Überstand von der Wand weg? Bei einem Satteldach die waagerechte Tiefe von der Wand bis zur Traufkante. Ein Balkon darüber zählt genauso. <b>0 schaltet die Rechnung ab.</b></li><li><b>Abstand zur Fensteroberkante</b> — wie viele Zentimeter liegen zwischen der Unterseite des Überstands und der Oberkante des Glases?</li><li><b>Fensterhöhe</b> — wie hoch ist das Glas? Daraus folgt, ab wann das Fenster nicht mehr nur teilweise, sondern ganz im Schatten liegt.</li></ul><b>Ein Beispiel, gerechnet für ein Südfenster mit 80 cm Auskragung, 30 cm Abstand und 140 cm Fensterhöhe:</b><table class='sm-tbl'><tr><th>Sonnenstand</th><th>Schatten an der Wand</th><th>Fenster im Schatten</th></tr><tr><td>15 Grad hoch (Dezembermittag)</td><td>21 cm</td><td>0 %</td></tr><tr><td>30 Grad hoch</td><td>46 cm</td><td>12 %</td></tr><tr><td>45 Grad hoch</td><td>80 cm</td><td>36 %</td></tr><tr><td>60 Grad hoch (Junimittag)</td><td>139 cm</td><td>78 %</td></tr></table>Steht die Sonne seitlich, wird der Schatten <b>tiefer</b>, nicht flacher — bei 60 Grad Höhe und 45 Grad seitlich liegt das ganze Fenster im Schatten. Das Plugin rechnet das über den Profilwinkel und braucht dafür keine weitere Eingabe.<br><br><b>Was diese Rechnung annimmt:</b> einen Überstand, der seitlich weit genug reicht — also ein durchlaufendes Dach, keinen schmalen Vorsprung über einem breiten Fenster. Im Zweifel lieber etwas weniger Auskragung eintragen; eine zu große lässt den Raum zu heiß werden, bevor beschattet wird."
W_GWERT = "g-Wert — woher bekomme ich den, und was bei Dreifachglas?"
W_GWERT_TEXT = "<b>Zuerst die Entwarnung:</b> der g-Wert ändert <b>nichts am Urteil</b>. Gemessen am Rechenkern liefern 85 und 25 Prozent dasselbe Urteil (−44) — verschieden ist nur die Wattzahl (1009 gegen 297 W). Er bestimmt also, wie viel Wärme angezeigt und in der Tagesbilanz gezählt wird, nicht ob beschattet wird. Wer ihn nicht genau kennt, darf schätzen; die Beschattung bleibt richtig.<br><br><b>Was der Wert bedeutet:</b> wie viel Prozent der auftreffenden Sonnenenergie durch die Scheibe in den Raum gelangt. 60 heißt: von 1000 Watt kommen 600 an. Fachbegriff: Gesamtenergiedurchlassgrad nach EN&nbsp;410.<br><br><b>Anhaltswerte nach Verglasungsart:</b><table class='sm-tbl'><tr><th>Verglasung</th><th>üblicher Bereich</th><th>eintragen</th></tr><tr><td>Einfachglas (bis etwa 1978)</td><td>80–87</td><td>85</td></tr><tr><td>Zweischeiben ohne Beschichtung (etwa 1978–1995)</td><td>70–78</td><td>75</td></tr><tr><td><b>Zweischeiben-Wärmeschutzglas</b> (ab etwa 1995)</td><td>50–65</td><td>60</td></tr><tr><td><b>Dreischeiben-Wärmeschutzglas</b> (ab etwa 2005)</td><td>45–55</td><td><b>50</b></td></tr><tr><td>Sonnenschutzglas</td><td>25–40</td><td>35</td></tr><tr><td>Starkes Sonnenschutzglas</td><td>15–25</td><td>20</td></tr></table><b>Dreifachglas lässt also weniger Wärme durch als Zweifachglas</b> — die dritte Scheibe und die zweite Beschichtung kosten Durchlass. Das ist im Winter ein Nachteil und im Sommer einer weniger.<br><br><b>Wo der genaue Wert steht — in dieser Reihenfolge suchen:</b><ul><li>In der <b>Auftragsbestätigung oder Rechnung des Fensterbauers</b>. Dort steht der Aufbau (etwa „4/16/4“) und meist g und U<sub>g</sub> dazu.</li><li>Im <b>Datenblatt des Glases</b> beim Hersteller. Der Handelsname der Beschichtung steht oft im <b>Randverbund</b>, also im Abstandhalter zwischen den Scheiben — dafür genügt ein Blick an den Rand der Scheibe.</li><li>Im <b>Energieausweis</b> oder in den Bauunterlagen; dort ist die Verglasung meist mit U<sub>w</sub> und g beschrieben.</li><li>Beim <b>Fensterbauer nachfragen</b> — mit Baujahr und Aufbau kann er es in einer Minute sagen.</li></ul><b>Wenn nichts davon greift:</b> nehmen Sie die Zeile aus der Tabelle, die zum Baujahr passt. Zwei Scheiben oder drei erkennt man an der Scheibenkante oder daran, wie viele Spiegelbilder eine Flamme in der Scheibe wirft — bei Dreifachglas sind es sechs, bei Zweifachglas vier."
W_HORIZONT = "Verschattungshorizont — wie messe ich das, ohne zu rechnen?"
W_HORIZONT_TEXT = "<b>Worum es geht:</b> ein Nachbarhaus, ein Baum oder ein Dachüberstand nimmt diesem Fenster morgens oder abends die Sonne. Wer das nicht einträgt, lässt das Plugin ein Fenster beschatten, auf das gar keine Sonne fällt.<br><br><b>Was einzutragen ist:</b> Wertepaare der Form <span class='sm-mono'>155:33</span> — gelesen als „in Richtung 155 Grad steht etwas 33 Grad hoch“. Die erste Zahl ist die <b>Himmelsrichtung</b> (0 = Nord, 90 = Ost, 180 = Süd, 270 = West), die zweite die <b>Höhe über dem Waagerechten</b>, vom Fenster aus gesehen.<br><br><b>Am einfachsten nehmen Sie den Rechner unten</b> — dort geben Sie nur Meter ein. Wer lieber selbst nachsieht: messen Sie, wie weit das Hindernis weg ist (Luftlinie, wie auf einer Landkarte) und wie viel höher seine Oberkante als Ihr Fenster liegt. Dann in dieser Tabelle:<table class='sm-tbl'><tr><th>Höhe über dem Fenster : Abstand</th><th>eintragen</th></tr><tr><td>1 : 5 &nbsp;(z. B. 3 m höher, 15 m weg)</td><td>11</td></tr><tr><td>1 : 4 &nbsp;(3 m höher, 12 m weg)</td><td>14</td></tr><tr><td>1 : 3 &nbsp;(4 m höher, 12 m weg)</td><td>18</td></tr><tr><td>1 : 2 &nbsp;(6 m höher, 12 m weg)</td><td>27</td></tr><tr><td>2 : 3 &nbsp;(8 m höher, 12 m weg)</td><td>34</td></tr><tr><td>1 : 1 &nbsp;(12 m höher, 12 m weg)</td><td>45</td></tr><tr><td>3 : 2 &nbsp;(18 m höher, 12 m weg)</td><td>56</td></tr></table>Dazwischen wird geschätzt — auf zwei Grad kommt es nicht an. <b>Ohne Zollstock:</b> strecken Sie den Arm aus. Eine Faust ist etwa 10 Grad hoch, eine gespreizte Hand etwa 20, eine Daumenbreite etwa 2.<br><br><b>Beispiel 1 — das Nachbarhaus steht direkt vor dem Fenster.</b> Es ist 12 m hoch und 13 m entfernt, Ihr Fenster liegt im Erdgeschoss (Oberkante etwa 1,5 m). Über dem Fenster bleiben 10,5 m auf 13 m Abstand, also etwa 4 zu 5 — das sind <b>39 Grad</b>. Das Haus ist breit und verdeckt beispielsweise den Bereich von 150 bis 210 Grad. Eintragen: <span class='sm-mono'>145:0, 150:39, 210:39, 215:0</span> — die beiden äußeren Punkte sagen „hier hört es auf“.<br><br><b>Beispiel 2 — das Nachbarhaus steht schräg.</b> Es liegt 25 Grad links vom Fenster, ist 13 m hoch und 18 m entfernt. Über dem Fenster bleiben 11,5 m auf 18 m, also etwa 2 zu 3 — das sind <b>33 Grad</b>. Schaut Ihr Fenster nach Süden (180 Grad), dann liegt „25 Grad links“ bei 155 Grad. Wenn das Haus von 140 bis 170 Grad reicht: <span class='sm-mono'>135:0, 140:33, 170:33, 175:0</span>.<br><br><b>Prüfen statt glauben:</b> das Bild „Sonnenbahn und Horizont“ weiter unten zeichnet Ihre Eingabe über den heutigen Sonnenlauf. Passt die graue Fläche nicht zu dem, was Sie aus dem Fenster sehen, stimmt eine Zahl nicht. Lassen Sie das Feld ruhig leer, wenn nichts im Weg steht — dann wird freie Sicht angenommen."
W_TRAEGHEIT = "Trägheit — wie schätze ich die?"
W_TRAEGHEIT_TEXT = "Ein schwerer Raum nimmt eine Stunde Sonne weg, ohne dass es jemand merkt — die Wärme verschwindet erst einmal in Estrich und Wänden. Ein leichter Raum ist nach derselben Stunde spürbar wärmer. Die Trägheit hebt deshalb die Beschattungsgrenze dieses Fensters an: <b>eingetragen werden Zehntelkelvin</b>, 10 sind also ein ganzes Grad.<br><br><b>Anhaltswerte:</b><table class='sm-tbl'><tr><th>Raum</th><th>eintragen</th><th>entspricht</th></tr><tr><td>Dachzimmer, Gipskarton, Holzboden, Fenster im Dach</td><td>0</td><td>&plusmn;0 K</td></tr><tr><td>Leichter Anbau, Trockenbauwände, wenig Möbel</td><td>3</td><td>0,3 K</td></tr><tr><td>Üblicher Wohnraum, Estrich, verputztes Mauerwerk</td><td>8</td><td>0,8 K</td></tr><tr><td>Massiver Raum, dicke Innenwände, Fliesen, Erdgeschoss</td><td>15</td><td>1,5 K</td></tr><tr><td>Keller oder Raum mit sehr viel Speichermasse</td><td>25</td><td>2,5 K</td></tr></table><b>Diese Zahlen sind gewählt, nicht gemessen.</b> Sie sind ein Anfang, kein Ergebnis. Wer es genauer will, schaltet im Reiter Einstellungen das Lernen ein und sieht nach einigen Wochen im Reiter Test unter „Aufheizkonstante“ nach, wie viel Kelvin dieser Raum je Kilowattstunde wirklich zulegt — <b>dann</b> hat man eine Messung. Bis dahin gilt: im Zweifel die kleinere Zahl. Eine zu große Trägheit lässt den Raum zu heiß werden, bevor beschattet wird."

[MQTT]
ERKLAERUNG = "Das MQTT-Gateway ist seit LoxBerry 3 Bestandteil des Systems und kein Plugin. Das Plugin schickt seine Werte über den UDP-Eingang des Gateways; dieses legt die virtuellen Eingänge im Miniserver selbst an. Der HTTP-Weg über den Endpunkt läuft daneben weiter und liefert dieselben Werte."
NICHT_GEFUNDEN = "Das MQTT-Gateway wurde nicht gefunden. In <span class='sm-mono'>config/system/general.json</span> steht kein Abschnitt <span class='sm-mono'>Mqtt</span>. Bitte unter System → MQTT Gateway einrichten."
