GRENZEN_ENG = "<b>PHP nimmt hier nur %s je Datei und %s je Absendung an.</b> Eine Loxone-Projektdatei ist meist 3 bis 4 MB groß — der Weg über den Browser scheitert damit. <b>Das Plugin kann diese Grenzen nicht anheben:</b> sie gelten je Verzeichnis und werden von PHP ausgewertet, bevor eine Zeile des Plugins läuft; <span class='sm-mono'>ini_set()</span> gibt für beide eine Fehlanzeige zurück. Nehmen Sie deshalb den Weg darunter: Datei nach <span class='sm-mono'>%s</span> legen und von dort einlesen. Das Plugin legt für sein <b>eigenes</b> Verzeichnis eine <span class='sm-mono'>.user.ini</span> ab, die diese Grenzen anhebt; ob dieser Webserver sie liest, sagt der Reiter Test in einer Zeile. Wer sie systemweit anheben will, findet <span class='sm-mono'>upload_max_filesize</span> und <span class='sm-mono'>post_max_size</span> in der php.ini des LoxBerry."
