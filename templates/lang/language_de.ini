ABO_V2 = "Dieses Gateway läuft in Fassung 2. Dort ist <b>nichts von Hand einzutragen</b>: die Themengruppe <span class='sm-mono'>%s</span> erscheint von selbst in den Abonnements, und die gewünschten Datenpunkte werden dort angehakt."
