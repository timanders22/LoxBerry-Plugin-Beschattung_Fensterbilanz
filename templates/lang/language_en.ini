THEMA = "The MQTT topic „%s“ contains characters that are not allowed. Allowed are lower case letters, digits, hyphen, underscore and the slash. The wildcards + and # are filter patterns and unusable as a target."
THEMA_LEER = "The topic prefix must not be empty. The previous value is kept — had it fallen back to „fenster“, every MQTT topic would have moved, and nothing would arrive at any virtual input in the Miniserver any more."
SPEICHERN = "The settings could not be written. Please check the permissions of the folder config/plugins."
FREMDES_FORMULAR = "This form carried no valid marker and was rejected. That protects against a foreign page silently re-rolling your token or clearing the log. Please reload the page and repeat."
