[EINST]
AB_WERK = "factory setting: %s"
BILANZ_ERKLAERUNG = "Not the temperature but the <b>amount of heat</b>. A room that has taken in three kilowatt hours since eight in the morning is full — even if the thermometer still says 24 degrees, because the wall is warm and gives it back in the evening. That is exactly what a snapshot lacks, and exactly what this plugin is named after. <b>The weight is 0 by default</b>: look at the watt hours for a week before letting them into the verdict."
BILD_ERKLAERUNG = "The shading horizon is entered as a row of numbers. Whether those numbers match what you see out of the window, a row of numbers cannot tell you — a picture can, in one second. Drawn is <b>today’s</b> sun arc, because that is the day on which you stand at the window and compare."
BILD_LEGENDE = "<b>Yellow</b> is today’s sun path, the yellow dot its current position. <b>Pale green</b> marks the range a vertical window can see at all — the dashed green line is its viewing direction. <b>Blue-grey</b> is the configured horizon: where that area covers the yellow line, no direct sun falls on this window.<br><b>If the heading says „no horizon configured“ there is no blue-grey area</b> — you then only see the pale green, and the plugin assumes a clear view for this window. <b>The horizon is entered in the window table above, in the column „shading horizon“</b> — or more conveniently with the calculator below it, which turns metres into the figures."
DAEMMEN_ERKLAERUNG = "A closed blind is thermal protection at night — the same energy balance, only with the opposite sign and without sun. Three things are required: the sun is down, it is cold enough, and the day actually <b>wants</b> heat. The third is the important one: on a mild August night a closed blind achieves nothing but a dark room. <b>Off by default</b> — it drives blinds, and that belongs switched on deliberately. Switched on it requires the reading <span class='sm-mono'>aussen</span>."
FELDER_HILFE = "<b>Short name</b> — letters, digits and underscore. It becomes the title of the virtual input (<span class='sm-mono'>FB_NAME_URTEIL</span>) and the MQTT branch. <b>Direction</b> — degrees from north clockwise, exactly like the <span class='sm-mono'>Dir</span> parameter of the AutoJalousie block: 0 = north, 90 = east, 180 = south, 270 = west. The values can be taken from the project file unchanged. <b>Tilt</b> — 90 for a vertical window, 0 for a horizontal roof window. <b>Glass area</b> — in square metres, per window. What is meant is the <b>glass</b>, not the opening in the wall: width times height of the pane, about 90 percent of the structural dimension on a standard window. It does <b>not</b> enter the verdict — a small and a large south facing window want the same thing at the same time. But it determines every watt figure, every watt hour and thus the measured heat-up constant; and as soon as the daily balance carries a weight, it does affect the verdict over the day. <b>g value</b> — total solar energy transmittance in percent, 55 to 65 for common double glazing, considerably less for solar control glass. <b>Room key</b> — lower case; under this name Loxone delivers <span class='sm-mono'>ist.&lt;key&gt;</span> and <span class='sm-mono'>grenze.&lt;key&gt;</span>. Several windows may name the same room. <b>Inertia</b> — tenths of a kelvin by which the shading limit is raised; a solid room tolerates an hour of sun, an attic room does not. <b>Shading horizon</b> — support points of the form <span class='sm-mono'>80:22, 110:14, 160:6</span>, read as „from azimuth 80 degrees an obstacle stands 22 degrees high“. Between the points it is interpolated linearly, outside them the nearest point applies. If the sun stands below the obstacle, the direct share falls away — the sky light remains."
FENSTER = "Window"
FENSTER_ERKLAERUNG = "One row per window. <b>Counting follows the row number</b>, not the filled rows — a row may stay empty without shifting the numbers below it. A row without a short name is skipped."
FLAECHE_VORGABE = "%d window(s) still carry the default glass area: %s. The verdict is still right — it does not depend on the area. What goes wrong are the watt figures, the daily balance and the measured heat-up constant."
GELEERT = "%d window row(s) cleared: %s. A cleared row looks like an unused one — direction 180, tilt 90, area 1.5 and g value 60 are the defaults, not content. Without a short name the row is skipped. The numbers of the other rows stay as they were; the button below closes the gaps."
H_ALBEDO = "How much sun the ground in front of the window reflects back — grass and dark soil about 20, light gravel or concrete 30 to 40, fresh snow up to 80. The value only affects vertical windows and does so weakly; when in doubt leave it at 20. <b>Snow is the exception:</b> a white garden can throw noticeably more light into the room in February than one expects."
H_BERICHT = "Daily report"
H_BERICHT_STUNDE = "When the daily report is written. It belongs at the end of the solar day but before midnight — 22:00 fits all year. The report then appears in the Test tab and, if MQTT is running, under <span class='sm-mono'>&lt;prefix&gt;/bericht</span>."
H_BILANZ = "Daily balance per room"
H_BILANZ_VOLL = "At 0 Wh the balance term is +1 (take it), on reaching the threshold −1 (enough). <b>The threshold is multiplied by the floor area of the room</b> — 150 Wh/m² is 750 Wh for a 5 m² bathroom and 3750 Wh for a 25 m² living room. A fixed figure per room would be far too high for the small bathroom and too low for the large one, because what heats a room up depends on its mass. A useful guide: the amount of heat that raises the room by two to three kelvin on a clear day. The table below shows what watt-hour figure this becomes per room."
H_BILD = "Sun path and horizon"
H_BREITE = "Geographic latitude of your house in degrees, positive to the north. Munich is at 48.1, Hamburg at 53.6, Zurich at 47.4. Two decimal places are enough: 0.01 degrees is about a kilometre, which shifts sunrise by a few seconds. Any map app gives you the value if you press and hold on your house."
H_DAEMMEN = "Night insulation"
H_DAEMMEN_EIN = "Switches night insulation on: the plugin then reports when a closed blind saves heat at night. <b>Off by default</b>, because this message drives blinds, and that belongs switched on deliberately. It needs the reading <span class='sm-mono'>aussen</span> from Loxone — without it nothing is reported."
H_DAEMM_GRENZE = "Below what outside temperature night insulation is worth it at all. 5 degrees means: only on cold nights. <b>Setting it higher brings little</b> — on a mild August night a closed blind saves nothing and only darkens the room. Whoever has badly insulated windows may go to 10."
H_E_REF = "From this value on the verdict counts at full strength, below it proportionally less. <b>What is weighed is the DIRECT share</b>, not the total irradiance at the glass. Reason: sky light and ground reflection are present at every window all day and are almost equal everywhere — on 23 Aug 2026 that was 121 W/m². Counting them in made even the north facing windows demand shading, which no sun reaches at all. The table still shows the full values; only the weight of the verdict depends on the direct share."
H_FENSTER = "The windows"
H_GEWICHTE = "The two terms are added with weights, not ANDed. An AND would let the room override the season — then September would be closed all day; an OR the other way round — then August would stay open. The sum does not have to be exactly 100, it is normalised anyway. <b>There is one hard cap:</b> a room above its shading limit never receives a positive verdict."
H_GEWICHT_BILANZ = "<b>0 by default, so switched off.</b> That is deliberate: look at the watt hours for a week before letting them help decide.<br><b>Where to see them:</b> in the Test tab the button „Daily balance“ — it lists per window and per room how much has come in today. Also in the status line as <span class='sm-mono'>WH_TAG</span> and in Loxone per window as <span class='sm-mono'>FB_&lt;name&gt;_WH</span>.<br><b>If you want to switch it on: 20 is a good start</b>, 30 for a house that heats up markedly over the day. The weights are set off against each other — giving the balance term 20 means room and day count correspondingly less. More than 40 noticeably turns the behaviour around: then the heat quantity of the day decides, no longer the temperature."
H_GEWICHT_MORGEN = "<b>0 by default, so switched off.</b> It only takes effect in the late afternoon, from the hour set below, and answers a single question: <b>will tomorrow be warmer or cooler than today?</b> If cooler, the last hour of sun may still come in today — the heat will not become a burden overnight. If hotter, every watt of this evening is one too many, because the house no longer cools down overnight.<br><b>Suggestion: 10 to 15.</b> That is deliberately little — the term should round off the evening, not determine the day. It needs the reading <span class='sm-mono'>prognose1</span> (tomorrow's daily maximum) from Loxone; without it nothing is calculated at all from that hour on, so import the template first, then set the weight."
H_GEWICHT_RAUM = "How strongly the <b>current room temperature</b> takes part in the decision. High means: what the thermometer in the room says sets the tone — the house reacts quickly but short-sightedly. Low means: the season decides. The weights are set off against each other, so they need not add up to 100. 40 against 60 means the day weighs slightly more than the moment."
H_GLAETTUNG = "The clearness index jumps considerably when clouds pass. Over this span the irradiance is averaged <b>before</b> anything is calculated with it — a single cloud must not upset the calculation, while a real change of weather must get through. This is not the hysteresis above: that one prevents chattering at the threshold, this one chattering of the measured quantity."
H_HIMMELSMODELL = "The isotropic model spreads the diffuse radiation evenly over the sky. Under a clear sky it is considerably stronger near the sun; HDKR accounts for that and yields roughly five to ten percent more at sun facing windows. <b>It only pays off once the heat-up constant is measured</b> — before that you compare model against model. HDKR can be checked by the fact that under an overcast sky it turns into exactly the isotropic model."
H_HOECHSTALTER = "A reading older than this counts as absent — and then nothing is guessed, <span class='sm-mono'>FB_OK</span> goes to 0. The value must be larger than the interval at which Loxone sends. For a daily forecast that changes hourly, 900 seconds is too tight; then a cyclic send in Loxone belongs with it."
H_IAM = "The coefficient describes how strongly the glass reflects at oblique incidence (ASHRAE: <span class='sm-mono'>1 − b0 · (1/cos θ − 1)</span>). 10 means b0 = 0.10 and fits clear double glazing. Larger means the glass shuts off earlier at grazing incidence."
H_LAGE = "Current situation"
H_LERNEN = "Records one pair of values per day and room: computed heat input in Wh against the measured temperature span of the day. Over a season this yields the number against which everything else can be calibrated — <b>kelvin per kilowatt hour, measured at this house instead of taken from a model</b>. The recording never enters the verdict."
H_MODELL = "The model"
H_MQTT_EIN = "Sends all values over MQTT as well. <b>This is the recommended route to Loxone</b>, because the values arrive by themselves instead of having to be fetched. Needs a configured MQTT gateway on the LoxBerry; whether it is running is stated in the MQTT tab. The HTTP route is unaffected."
H_ORT = "Location"
H_PV = "Cross-check against the PV yield forecast"
H_PV_ABWEICHUNG = "From what deviation in percent a warning is issued. 25 is generous and exactly right: passing clouds easily make ten to fifteen percent difference, a soiled sensor makes more, permanently. <b>Set too small the plugin warns on every changeable day</b> — and a warning one clicks away is none."
H_PV_GEGENPROBE = "Compares the reported irradiance over days with the yield forecast of your solar system. <b>This is not a second weather source</b> — the measured value continues to be used. If the two drift apart, the irradiance sensor is probably soiled, shaded or misaligned. A warning is issued, nothing is changed. Needs the reading <span class='sm-mono'>pv_prognose</span>."
H_RAEUME = "The floor areas of the rooms"
H_RAUMFLAECHE_VORGABE = "For every room whose floor area was neither entered nor read from the project file. <b>Not 0:</b> a room without extent would be full immediately, and the balance term would sit permanently at −1 without anyone noticing. Where an estimate is used, the explanation sentence of the window says so."
H_RECHENTAKT = "On a weather change Loxone fires several virtual outputs in the same second. Without a minimum interval the plugin would recalculate for each of them and send a full MQTT burst every time."
H_SCHWELLEN = "The two values form a hysteresis. Without it the blind would move up and down every minute at the threshold. The release threshold must be smaller than the shading threshold."
H_SCHWELLE_EIN = "From what verdict <span class='sm-mono'>BESCHATTEN</span> goes to 1. −30 means the verdict has to be clearly in the negative range. Together with the field below this forms a hysteresis: switched on at −30, switched off again only at −15. <b>Without that gap the blind flutters</b> as soon as the verdict hovers around the threshold."
H_SICHERUNG = "Back up and restore settings"
H_SPREIZUNG = "Over this span the respective term runs continuously from +1 (heat welcome) to −1 (heat unwanted). A small span makes the verdict hard and jumpy, a large one soft and sluggish. 20 tenths of a kelvin are 2.0 kelvin."
H_SPREIZUNG_TAG = "Over how many kelvin the day term swings from „heat welcome“ to „heat unwanted“. With 6 and a day limit of 20 that means: 17 degrees expected = fully welcome, 20 = neutral, 23 = fully unwanted. <b>Small makes the verdict hard and jumpy, large makes it soft and sluggish.</b> Whoever keeps switching between shaded and open in spring raises this value."
H_STELLUNG = "Feedback of the blind position"
H_STELLUNG_EIN = "Switches position feedback on: the plugin then compares whether Loxone actually carried out its demand. <b>Off by default</b>, because it requires another virtual output per window — Loxone has to send the blind position in as <span class='sm-mono'>stellung.&lt;name&gt;</span>. It was precisely this feedback that was missing on the day this plugin came from."
H_STELLUNG_FRIST = "A blind needs its time, and the AutoJalousie block has its own switch-on delay. Without a delay the plugin would report a deviation on every run."
H_STELLUNG_ZU = "From what reported position in percent a blind counts as „driven“. 70 means at least seventy percent closed. Set it lower if your shading only travels part way and that is meant to be enough."
H_TAGESGRENZE = "<b>This is the single most important value of the whole plugin.</b> It answers the question a switching condition in Loxone gets wrong: not „is it warm outside?“ but „does the house want heat today?“. On 23 Aug 2026 it was 19.5 degrees outside and 32.7 degrees in the living room — the outside air would have said „let it in“, and the day reached 28 degrees. Not to be confused with the heating limit temperature of building physics (typically 15 degrees): that refers to the daily mean, while this is the maximum, which runs about 5 kelvin higher in the transition season."
H_VORABEND = "Evening: tomorrow’s forecast"
H_VORABEND_AB = "From what time of day the evening term counts at all. Before that the question „will tomorrow be warmer?“ is irrelevant — today still has plenty of time. 16:00 is a usable start; in high summer 17:00 will do too."
H_VORSCHAU = "Look ahead"
KEIN_STANDORT = "<b>No location is configured.</b> Without latitude and longitude there is no sun position and therefore no verdict. The location is in the Loxone project file in the <span class='sm-mono'>Document</span> section."
K_LUECKEN = "Close gaps — move rows up"
K_SICHERN = "Back up settings"
K_ZURUECK = "Restore"
LAGE_ERKLAERUNG = "One verdict per window, from <b>−100</b> (shade by all means) to <b>+100</b> (let the sun in), plus a digital value for simple wiring. The plugin <b>switches nothing</b>. It supplies what Loxone is missing — whether the solar gain is welcome — and feeds the <span class='sm-mono'>AutoShade</span> input of the AutoJalousie block. Its angle and slat calculation stays untouched."
LUECKEN_ERKLAERUNG = "There are empty rows <b>between</b> filled ones. That does no harm — an empty row is skipped. If you prefer it tidy, this button moves them up. <b>Nothing changes in Loxone:</b> the virtual inputs are named after the short name (<span class='sm-mono'>FB_&lt;name&gt;_URTEIL</span>), not after the row number. The watt hours of the current day are rewritten along with them, so they stay with their window."
LUECKEN_KEINE = "There are no gaps — the filled rows already sit together at the top."
LUECKEN_ZU = "%d row(s) moved up, %d filled rows now sit without gaps. The watt hours of the current day moved along."
