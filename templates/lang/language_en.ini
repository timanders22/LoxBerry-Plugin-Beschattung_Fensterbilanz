NICHT_LESBAR = "The file %s could not be read. Usually the user loxberry lacks read permission; on the LoxBerry this helps: chmod 644 on that file."
SPEICHER = "Careful: %s is %.1f MB, but PHP may only use %s of memory here. Reading can break off in the middle, and such a break looks like a broken file. The value is called memory_limit and is in the php.ini."
GRENZEN_OK = "PHP accepts up to %s per file and %s per submission here — that is enough for a project file. If you would rather not submit anything at all: putting it into <span class='sm-mono'>%s</span> works too."
GRENZEN_ENG = "<b>PHP only accepts %s per file and %s per submission here.</b> A Loxone project file is usually 3 to 4 MB — the browser route therefore fails. <b>The plugin cannot raise these limits:</b> they apply per directory and are evaluated by PHP before a single line of the plugin runs; <span class='sm-mono'>ini_set()</span> reports failure for both. So take the route below: put the file into <span class='sm-mono'>%s</span> and read it from there. The plugin puts a <span class='sm-mono'>.user.ini</span> into its <b>own</b> directory that raises these limits; whether this web server reads it is stated in one line in the Test tab. Whoever wants to raise them system-wide finds <span class='sm-mono'>upload_max_filesize</span> and <span class='sm-mono'>post_max_size</span> in the LoxBerry php.ini."
