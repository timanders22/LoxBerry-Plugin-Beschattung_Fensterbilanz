AUSZUG_ZU_NEU = "This extract comes from a newer version of the extractor script than this plugin knows. Please download the script above again."
AUSZUG_OHNE_FENSTER = "The extract contains not a single blind block. Either the project file has no AutoJalousie block, or something was lost while pasting."
SKRIPT_FEHLT = "The extractor script was not found in the plugin template folder. Usually reinstalling the plugin helps."
