KUERZEL_GEAENDERT = "Window %d: The short name „%s“ became „%s“. Only letters, digits and the underscore are allowed, because it becomes the title of a virtual input and an MQTT branch. Please check whether that was intended."
KUERZEL_DOPPELT = "Window %d: The short name „%s“ is already used in row %d. Two identical short names would create two virtual inputs with the same title and two MQTT topics overwriting each other — silently. Nothing has been saved."
RAUM_FEHLT = "Window %d: Room values are switched on but no room key is entered. Without it the plugin does not know which temperature belongs to this window."
RAUM_GEAENDERT = "Window %d: the room key was simplified from „%s“ to „%s“. Allowed are lower case letters, digits and underscore. Important: in Loxone the readings must arrive under the NEW name — that is ist.%3$s and grenze.%3$s."
HORIZONT = "Window %d: the shading horizon cannot be read at this point: %s. Expected are value pairs of the form 80:22, 110:14 — azimuth in degrees, colon, obstacle elevation in degrees, separated by commas. The unreadable parts are ignored."
SCHWELLEN = "The release threshold (%d) must be SMALLER than the shading threshold (%d). Otherwise there is no hysteresis but chattering at the threshold — the blind would move up and down every minute."
