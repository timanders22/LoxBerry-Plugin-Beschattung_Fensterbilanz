STELLUNG_ERKLAERUNG = "The plugin delivers a verdict and otherwise never sees what Loxone made of it. <b>That is exactly how the incident behind this plugin came about</b>: fifteen room controllers reported demand, not one blind moved, and nobody noticed. Switched on, the plugin expects one further virtual output per window, <span class='sm-mono'>stellung.&lt;name&gt;</span> with the position in percent, and reports when demand and reality drift apart."
VORABEND_ERKLAERUNG = "In the morning tomorrow’s forecast says nothing about whether this sun is welcome now — the house has a night in between. In the late afternoon, however, the heat stays in the house until tomorrow morning: if it gets cooler, it is welcome; if it gets hotter, it is a burden, because the house no longer cools down overnight. <b>Off by default.</b> Switched on, this term requires the reading <span class='sm-mono'>prognose1</span>."
W_BLENDUNG = "Glare — what do the two numbers mean?"
W_BLENDUNG_TEXT = "Glare is a <b>separate message</b> and does not enter the verdict: a low sun glares in January too, when the heat is most welcome. In Loxone this value therefore belongs on a different input than the heat release.<br><br><b>First number — up to what sun elevation glare is reported.</b> This is the angle of the sun above the horizon: 0 degrees is sunrise, 90 degrees would be straight overhead. If the sun is <b>lower</b> than your number, it comes in flat through the window and hits eye level. You do not have to measure anything — the plugin computes the elevation itself. For orientation, calculated for your location:<table class='sm-tbl'><tr><th>Day</th><th>8:00</th><th>12:00</th><th>16:00</th><th>18:00</th></tr><tr><td>21 June</td><td>25&#176;</td><td>61&#176;</td><td>49&#176;</td><td>30&#176;</td></tr><tr><td>21 March</td><td>17&#176;</td><td>42&#176;</td><td>23&#176;</td><td>4&#176;</td></tr><tr><td>21 December</td><td>&minus;1&#176;</td><td>18&#176;</td><td>2&#176;</td><td>&minus;15&#176;</td></tr></table><b>Useful values:</b> 25 for a workplace by the window, 20 for a living room, 15 for „only with a really flat sun“. <b>0 switches the glare message off.</b> Note the last row: in December the sun here never rises above 18 degrees — with a 20 a south facing window then reports glare all day. That may be intended; it should not come as a surprise.<br><br><b>Second number — how obliquely the sun may still stand.</b> The angle between the sun and the viewing direction of the window, measured from the perpendicular to the pane: 0 degrees means „the sun stands exactly in front of the window“, 90 degrees would mean „it grazes the pane from the side“. Only if the sun stands <b>closer</b> than your number does it shine into the room rather than past it. The plugin computes this too. <b>40 degrees is a useful value</b>; 30 reports only with a fairly frontal sun, 60 almost whenever the sun is on that side at all.<br><br>Glare is reported only when <b>both</b> apply and the sun is not behind the configured horizon anyway."
W_DACH = "Roof overhang, canopy, balcony — three figures with a tape measure"
W_DACH_TEXT = "<b>Why this does not belong in the shading horizon:</b> the horizon takes the sun away when it stands <b>low</b> — a neighbouring house, a tree. A roof overhang does the opposite: it keeps the <b>high</b> summer sun out and lets the flat winter sun in. That is exactly what it is built for. Writing both into the same list of figures would not work; the shading would be entered the wrong way round.<br><br><b>Three figures, all in centimetres:</b><ul><li><b>Projection</b> — how far does the overhang reach out from the wall? On a pitched roof, the horizontal depth from the wall to the eaves. A balcony above counts just the same. <b>0 switches the calculation off.</b></li><li><b>Distance to the top of the window</b> — how many centimetres lie between the underside of the overhang and the top edge of the glass?</li><li><b>Window height</b> — how tall is the glass? From that follows when the window is no longer partly but wholly in shadow.</li></ul><b>An example, calculated for a south facing window with 80 cm projection, 30 cm distance and 140 cm window height:</b><table class='sm-tbl'><tr><th>Sun position</th><th>Shadow on the wall</th><th>Window in shadow</th></tr><tr><td>15 degrees high (December noon)</td><td>21 cm</td><td>0 %</td></tr><tr><td>30 degrees high</td><td>46 cm</td><td>12 %</td></tr><tr><td>45 degrees high</td><td>80 cm</td><td>36 %</td></tr><tr><td>60 degrees high (June noon)</td><td>139 cm</td><td>78 %</td></tr></table>When the sun stands to the side the shadow gets <b>deeper</b>, not shallower — at 60 degrees elevation and 45 degrees to the side the whole window lies in shadow. The plugin computes this via the profile angle and needs no further input for it.<br><br><b>What this calculation assumes:</b> an overhang that reaches far enough sideways — that is, a continuous roof, not a narrow canopy over a wide window. When in doubt enter a slightly smaller projection; too large a one lets the room get too hot before it is shaded."
W_GWERT = "g value — where do I get it, and what about triple glazing?"
W_GWERT_TEXT = "<b>First the reassurance:</b> the g value changes <b>nothing about the verdict</b>. Measured against the calculation core, 85 and 25 percent give the same verdict (−44) — only the watt figure differs (1009 against 297 W). So it determines how much heat is displayed and counted in the daily balance, not whether shading happens. Whoever does not know it exactly may estimate; the shading stays correct.<br><br><b>What the value means:</b> what percentage of the incident solar energy passes through the pane into the room. 60 means: of 1000 watts, 600 arrive. Technical term: total solar energy transmittance to EN&nbsp;410.<br><br><b>Guide values by glazing type:</b><table class='sm-tbl'><tr><th>Glazing</th><th>usual range</th><th>enter</th></tr><tr><td>Single pane (up to about 1978)</td><td>80–87</td><td>85</td></tr><tr><td>Double pane, uncoated (about 1978–1995)</td><td>70–78</td><td>75</td></tr><tr><td><b>Double low-e glazing</b> (from about 1995)</td><td>50–65</td><td>60</td></tr><tr><td><b>Triple low-e glazing</b> (from about 2005)</td><td>45–55</td><td><b>50</b></td></tr><tr><td>Solar control glass</td><td>25–40</td><td>35</td></tr><tr><td>Strong solar control glass</td><td>15–25</td><td>20</td></tr></table><b>Triple glazing therefore lets less heat through than double glazing</b> — the third pane and the second coating cost transmittance. That is a disadvantage in winter and one less in summer.<br><br><b>Where the exact value is written — search in this order:</b><ul><li>In the <b>order confirmation or invoice of the window maker</b>. It states the build-up (such as „4/16/4“) and usually g and U<sub>g</sub> with it.</li><li>In the <b>data sheet of the glass</b> at the manufacturer. The trade name of the coating is often on the <b>spacer</b> between the panes — a look at the edge of the pane is enough.</li><li>In the <b>energy performance certificate</b> or the building documents; the glazing is usually described there with U<sub>w</sub> and g.</li><li><b>Ask the window maker</b> — with the year of construction and the build-up they can say it in a minute.</li></ul><b>If none of that works:</b> take the row of the table that matches the year of construction. Two panes or three can be told from the edge of the pane, or from how many reflections of a flame the pane shows — six with triple glazing, four with double."
W_HORIZONT = "Shading horizon — how do I measure it without doing maths?"
W_HORIZONT_TEXT = "<b>What it is for:</b> a neighbouring house, a tree or a roof overhang takes the sun off this window in the morning or evening. Without it the plugin shades a window that no sun reaches.<br><br><b>What to enter:</b> value pairs like <span class='sm-mono'>155:33</span> — read as „in direction 155 degrees something stands 33 degrees high“. The first number is the <b>direction</b> (0 = north, 90 = east, 180 = south, 270 = west), the second the <b>height above the horizontal</b> as seen from the window.<br><br><b>The easiest way is the calculator below</b> — there you only enter metres. If you would rather look it up yourself: measure how far away the obstacle is (straight line, as on a map) and how much higher its top edge is than your window. Then:<table class='sm-tbl'><tr><th>Height above the window : distance</th><th>enter</th></tr><tr><td>1 : 5 &nbsp;(e.g. 3 m higher, 15 m away)</td><td>11</td></tr><tr><td>1 : 4 &nbsp;(3 m higher, 12 m away)</td><td>14</td></tr><tr><td>1 : 3 &nbsp;(4 m higher, 12 m away)</td><td>18</td></tr><tr><td>1 : 2 &nbsp;(6 m higher, 12 m away)</td><td>27</td></tr><tr><td>2 : 3 &nbsp;(8 m higher, 12 m away)</td><td>34</td></tr><tr><td>1 : 1 &nbsp;(12 m higher, 12 m away)</td><td>45</td></tr><tr><td>3 : 2 &nbsp;(18 m higher, 12 m away)</td><td>56</td></tr></table>In between, estimate — two degrees do not matter. <b>Without a tape measure:</b> stretch out your arm. A fist is about 10 degrees high, a spread hand about 20, a thumb width about 2.<br><br><b>Example 1 — the neighbouring house stands right in front of the window.</b> It is 12 m high and 13 m away, your window is on the ground floor (top edge about 1.5 m). That leaves 10.5 m above the window at 13 m distance, roughly 4 to 5 — that is <b>39 degrees</b>. The house is wide and covers, say, the range from 150 to 210 degrees. Enter: <span class='sm-mono'>145:0, 150:39, 210:39, 215:0</span> — the two outer points say „it ends here“.<br><br><b>Example 2 — the neighbouring house stands at an angle.</b> It lies 25 degrees to the left of the window, is 13 m high and 18 m away. That leaves 11.5 m above the window at 18 m, roughly 2 to 3 — that is <b>33 degrees</b>. If your window faces south (180 degrees), „25 degrees to the left“ is 155 degrees. If the house spans 140 to 170 degrees: <span class='sm-mono'>135:0, 140:33, 170:33, 175:0</span>.<br><br><b>Check rather than believe:</b> the picture „sun path and horizon“ further down draws your entry over today's course of the sun. If the grey area does not match what you see out of the window, a number is wrong. Leave the field empty if nothing is in the way — then a clear view is assumed."
W_TRAEGHEIT = "Thermal inertia — how do I estimate it?"
W_TRAEGHEIT_TEXT = "A heavy room absorbs an hour of sun without anyone noticing — the heat disappears into screed and walls first. A light room is noticeably warmer after the same hour. The inertia therefore raises the shading limit of this window: <b>enter tenths of a kelvin</b>, so 10 is a whole degree.<br><br><b>Guide values:</b><table class='sm-tbl'><tr><th>Room</th><th>enter</th><th>equals</th></tr><tr><td>Attic room, plasterboard, wooden floor, roof window</td><td>0</td><td>&plusmn;0 K</td></tr><tr><td>Light extension, dry wall partitions, little furniture</td><td>3</td><td>0.3 K</td></tr><tr><td>Ordinary living room, screed, plastered masonry</td><td>8</td><td>0.8 K</td></tr><tr><td>Massive room, thick internal walls, tiles, ground floor</td><td>15</td><td>1.5 K</td></tr><tr><td>Cellar or room with a great deal of storage mass</td><td>25</td><td>2.5 K</td></tr></table><b>These figures are chosen, not measured.</b> They are a start, not a result. Whoever wants it more precisely switches learning on in the Settings tab and looks, after a few weeks, at „heat-up constant“ in the Test tab to see how many kelvin per kilowatt hour this room really gains — <b>then</b> it is a measurement. Until then: when in doubt, the smaller number. Too much inertia lets the room get too hot before it is shaded."

