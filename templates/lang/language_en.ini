[PROJEKT]
H = "Window list from a Loxone project file"
ERKLAERUNG = "The orientation of every window is already in your <span class='sm-mono'>.Loxone</span> file, in <span class='sm-mono'>Dir</span> and <span class='sm-mono'>DirTol</span> of the AutoJalousie blocks. Typing it in again is not only work, it is a source of error: a transposed digit in the azimuth is invisible from outside and shifts the shading of a window by hours. <b>It proposes, it does not set</b> — the list read appears for inspection, and only the second button writes it, and then only into empty rows."
L_DATEI = "Project file"
H_DATEI = "A project file is several megabytes. PHP accepts at most <span class='sm-mono'>%s</span> per file and <span class='sm-mono'>%s</span> per submission here; if the file is larger the message says so, and both values can be raised in the php.ini of the LoxBerry."
K_LESEN = "Read the project file"
K_UEBERNEHMEN = "Write proposals into empty rows"
KEINE_DATEI = "No file was submitted."
UPLOAD_FEHLER = "The file could not be accepted (error number %d). PHP accepts at most %s per file and %s per submission here — a Loxone project file is usually larger. The plugin cannot change that: both values apply per directory and are evaluated before a single line of the plugin runs. The easier route goes around the submission: put the file into %s and read it from there above — there is no size limit there. Whoever would rather raise the limits finds upload_max_filesize and post_max_size in the LoxBerry php.ini."
LEER = "The submitted file was empty."
NICHTS = "Not a single AutoJalousie block with a readable direction was found in this file. Reported was: %s"
GELESEN = "%d blocks read, %d without a readable direction."
UNLESBAR = "For these blocks the direction cannot be read and is therefore not guessed: %s. There the Dir parameter is probably wired to an input instead of a fixed number; those windows have to be entered by hand."
H_VORSCHLAG = "Proposal: %d windows"
SP_BAUSTEIN = "Block in the project file"
UEBERNOMMEN = "%d windows written into empty rows, %d skipped. Please add area, g value and shading horizon."
RAEUME_GELESEN = "Plus %d room floor areas. The WINDOW areas are not in the project file — the AutoJalousie block carries the direction and the slat dimensions, not window dimensions."
RAEUME_DOPPELT = "Not taken over because ambiguous: %s. These room names yield the same room key, and only the user knows which of the two areas is meant — nothing is guessed here. Enter it by hand if needed."
RAEUME_UEBERNOMMEN = "%d room floor areas taken over."
H_ORDNER = "Route 2: put the file on the LoxBerry"
H_AUSZUG = "Route 1: paste an extract (gets past every limit)"
AUSZUG_ERKLAERUNG = "The project file is almost four megabytes. What this plugin needs from it is <b>about two and a half kilobytes</b>: a title and a direction per blind block, a title and a floor area per room. The script below extracts exactly that from the file on your own machine and puts it on the clipboard — paste, press the button, done. <b>This route needs neither a submission nor a file on the LoxBerry</b> and is therefore the most reliable one."
K_SKRIPT = "Download the extractor script (PowerShell)"
L_AUSZUG = "Paste extract"
H_AUSZUG_FELD = "Call it on the Windows machine: <span class='sm-mono'>powershell -ExecutionPolicy Bypass -File fensterbilanz_auszug.ps1</span> — without further arguments a file chooser opens for the <span class='sm-mono'>.Loxone</span> file. The script decides nothing: short names and room keys are still derived here in the plugin, so that both routes yield the same names."
K_AUSZUG = "Read the extract"
