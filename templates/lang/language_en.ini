; Fensterbilanz - English texts
;
; English is the FALLBACK, not German: readlanguage loads the foreign
; language first, then English, and does not overwrite existing keys. A
; missing German key therefore shows up in English, not empty.
;
; Real UTF-8 characters, no HTML entities in labels - labels go through
; fb_e(). Attributes inside markup are single quoted (class='sm-mono'): a
; second double quote would end the value early, silently.

