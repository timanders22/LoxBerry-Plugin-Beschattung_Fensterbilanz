ORDNER_ERKLAERUNG = "Get the <span class='sm-mono'>.Loxone</span> file onto the LoxBerry — preferably into <span class='sm-mono'>%s</span>. It then appears in the list below. <b>There is no size limit on this route</b>, because nothing is submitted: the plugin reads the file straight from the file system. <b>Do not put it into the plugin data folder</b> — that is deleted on uninstall, and whoever uninstalls before reinstalling will look for the file in vain. <b>The LoxBerry file manager usually does not help here</b>: it hangs on the same limits as any other submission and often stays silent on a file that is too large."
ORDNER_FLUECHTIG = "Careful: the only drop folder available here is the plugin data folder (%s) — and that is deleted along with its contents on uninstall. Whoever uninstalls the plugin before reinstalling loses the file there. In that case use the extract route above instead."
ORDNER_BEFEHL = "From a Windows machine one line at the command prompt is enough (<span class='sm-mono'>scp</span> ships with Windows): <span class='sm-mono'>scp YourFile.Loxone loxberry@%s:%s/</span> — the password is that of the user loxberry. WinSCP or the LoxBerry Windows share work just as well."
ORDNER_WURZELN = "The search covers these folders and two levels below them: <span class='sm-mono'>%s</span>. Where within these folders you put the file does not matter — a mounted USB stick is included. The home directory is <b>not</b>: on a LoxBerry it can be the whole tree, and searching it on every page load would not be worth the wait."
