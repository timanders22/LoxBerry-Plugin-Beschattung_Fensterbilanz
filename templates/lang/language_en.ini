[LOX]
H = "Loxone integration"
S1 = "<b>Step 1 — choose the route.</b> MQTT is the standard route: the gateway creates the names of the virtual inputs itself, in Loxone a suitably named input is enough. The HTTP route through the endpoint is the fallback and delivers the same figures in a text line. Both may run at the same time."
S2_V1 = "<b>Step 2 — enter the subscription.</b> Under System → MQTT Gateway → Subscriptions add the line <span class='sm-mono'>%s/#</span>. Without that entry nothing arrives at the Miniserver."
S2_V2 = "<b>Step 2 — nothing to do here.</b> MQTT gateway V2 detects the topic group by itself; the group <span class='sm-mono'>%s</span> appears under <i>Subscriptions</i>, where the data points are ticked individually."
H_MESSWERTE = "Step 3 — feed the readings in"
MESSWERTE_TEXT = "<b>Without this step the plugin calculates nothing.</b> It measures nothing itself: irradiance, outside temperature, daily forecast and the room values come from the Miniserver. For that <b>one virtual output</b> is created in Loxone whose commands push the values to the endpoint. The button below produces the ready made import file. In Loxone each of these commands is fed with the respective value; for the daily forecast the maximum temperature t+0 from Weather4Loxone fits, for the shading limit the parameter <span class='sm-mono'>TShadeHeat</span> of the room controller. <b>Important:</b> Loxone only sends a virtual output on value change. A quantity that does not change for hours eventually counts as stale here — so add a cyclic pulse in Loxone or choose the maximum age accordingly."
SP_BEFEHL = "Command on ON"
SP_EINGETROFFEN = "Last received"
VOR_SEKUNDEN = "%d s ago: %s"
NIE_EINGETROFFEN = "never"
OPTIONAL = "optional"
KEINE_RAEUME = "No window with room values is configured yet — so only the four general quantities are listed above."
K_VQ = "Create template for the reading outputs"
H_ADRESSE = "The endpoint addresses"
ADRESSE_HILFE = "These addresses are complete and can be copied unchanged — including the token. <b>If the token is re-rolled, all three change</b> and the old addresses answer with HTTP 403. The host name is a suggestion: what counts is the name under which the Miniserver reaches this LoxBerry."
SP_ZWECK = "Purpose"
SP_ADRESSE = "Address"
Z_STATUS = "All values as text lines (this is the address of the input template)"
Z_JSON = "The same as JSON, including the explanation per window"
Z_FENSTER = "A single window as JSON (k = short name)"
Z_FENSTER_BSP = "SHORTNAME"
Z_SELFTEST = "Self test — answers the token question without triggering anything"
TOKEN_HINWEIS = "Even the read-only calls require a token. Reason: the answer contains room temperatures. That is no trade secret, but it tells everybody on the home network whether someone is at home."
H_FELDER = "Step 4 — the virtual inputs"
FELDER_HILFE = "Four values per window plus nine summary values. <b>Minimum and maximum are not decoration:</b> Loxone clips a value to the limits of the virtual input, and it does so silently. A verdict with minimum 0 would arrive as 0 from every window that needs shading — that is exactly the value meaning „no opinion“."
SP_TITEL = "Title"
SP_EINHEIT = "Unit"
SP_BEREICH = "Min … Max"
SP_BEDEUTUNG = "Meaning"
KEINE_FENSTER = "No window is configured yet. The template would then contain only the summary values."
H_ALLES = "Create everything at once"
ALLES_TEXT = "The button creates an import file for Loxone Config with all virtual inputs including title, comment, unit and limits. Read it in through <b>File → Import template</b> in Loxone Config. <b>Loxone Config creates new objects on import and overwrites nothing</b> — importing twice means duplicate objects."
K_VI = "Create template for Loxone Config"
FEHLER_VORLAGE = "The template could not be created. Is at least one window configured?"
H_AUSFALL = "Step 5 — failure detection"
AUSFALL_TEXT = "Virtual inputs keep their last value. If the plugin stops, everything looks normal in the app — the blinds would stay forever where they last were. There are two values against this. <span class='sm-mono'>FB_OK</span> goes to 0 as soon as a reading is missing or stale. And <span class='sm-mono'>FB_TS</span> carries the time of the last run — <b>let Loxone compute the age from it</b> and raise an alarm when it grows beyond ten minutes. <span class='sm-mono'>FB_HERZ</span> only serves this purpose over HTTP: over MQTT sending happens right after computing, so the value is always 0 at send time and stays there once nothing is sent any more. <b>This belongs in your Loxone logic</b>, wired so that the AutoJalousie's own release takes over on failure. The plugin itself falls back to “no opinion” in that case: verdict 0, shade 0."
H_BAUSTEINE = "Step 6 — the blocks to rebuild"
BAUSTEINE = "<table class='sm-tbl'><tr><th>#</th><th>Block (type)</th><th>Name (suggestion)</th><th>Parameters</th><th>Connect inputs to</th></tr><tr><td>1</td><td>Status block</td><td>Window balance valid</td><td>—</td><td><span class='sm-mono'>FB_OK</span></td></tr><tr><td>2</td><td>Analogue comparator</td><td>Window balance stalled</td><td>greater than 15, on delay 300 s</td><td><span class='sm-mono'>FB_HERZ</span></td></tr><tr><td>3</td><td>OR</td><td>Window balance unusable</td><td>—</td><td>output of #2 and the inverted <span class='sm-mono'>FB_OK</span></td></tr><tr><td>4</td><td>Notification block (optional)</td><td>Window balance message</td><td>subject and text free</td><td>#3 — and <b>only</b> #3</td></tr><tr><td>5</td><td>OR</td><td>Shading release per window</td><td>one per window</td><td><span class='sm-mono'>FB_&lt;name&gt;_BESCHATTEN</span> and the previous release path, ANDed with #3</td></tr><tr><td>6</td><td>AutoJalousie</td><td>already present, is not replaced</td><td><span class='sm-mono'>Dir</span>, <span class='sm-mono'>DirTol</span>, <span class='sm-mono'>AutoShadeTime</span> stay unchanged</td><td>input <span class='sm-mono'>AutoShade</span> ← output of #5</td></tr><tr><td>7</td><td>Statistics</td><td>Verdict per window</td><td>analogue value, recording every 5 minutes</td><td><span class='sm-mono'>FB_&lt;name&gt;_URTEIL</span></td></tr><tr><td>8</td><td>Statistics (optional)</td><td>Gain per window</td><td>analogue value in watts</td><td><span class='sm-mono'>FB_&lt;name&gt;_WATT</span></td></tr><tr><td>9</td><td>Status block (optional)</td><td>Why shaded</td><td>text per number, see the table in the MQTT tab</td><td><span class='sm-mono'>FB_&lt;name&gt;_GRUND</span></td></tr><tr><td>10</td><td>Virtual output</td><td>Window balance readings</td><td>from the template in step 3</td><td>values for irradiance, outside temperature, forecast and per room actual and limit</td></tr></table>"
BAUSTEINE_ERL = "<b>On #2:</b> The threshold is 15 minutes, three times the cron interval. Set tighter it reports on every missed run, and after the third message nobody looks any more. <b>On #3 and #5:</b> This is the most important connection in the whole list. The plugin may only have a say while its values are valid — otherwise the previous release condition must continue alone. Building #5 without the AND leaves you with shading frozen in its last position if the LoxBerry fails. <b>On #4:</b> The notification block only fires on the transition from off to on. Never connect several sources directly to its input — merge them through the OR first, otherwise a permanently pending source swallows all the others. <b>On #6:</b> The AutoJalousie block is <b>not replaced</b>. Its angle and slat calculation is good; what it lacks is the judgement whether the heat is welcome. That is what this plugin supplies, and only at <span class='sm-mono'>AutoShade</span>. <b>On #7:</b> The statistics over the verdict is the most useful value of the whole plugin. Looking at it after a week shows immediately whether day limit and weights fit — before changing them. <b>On #10:</b> Loxone only sends a virtual output on value change. A forecast that does not move for hours eventually counts as stale here; a cyclic pulse every ten minutes costs nothing and saves the search. <b>Loxone time:</b> Loxone counts seconds since 01 Jan 2009. When calculating with <span class='sm-mono'>FB_TS</span>, subtract <span class='sm-mono'>1230768000</span> from the Loxone time. All blocks can be found in Loxone Config through the block search with <b>F5</b>."
H_GEGENPROBE = "Step 7 — the cross check"
GEGENPROBE_TEXT = "<b>First:</b> look at the column „Last received“ in the tab „Loxone integration“. If a quantity says „never“, the virtual output is not sending — then the address is wrong or the token is stale. <b>Second:</b> press the button „Self check“ in the Test tab. It answers in a list whether the setup holds. <b>Third:</b> watch one of the virtual inputs in the Loxone Config monitor. If <span class='sm-mono'>FB_HERZ</span> changes every minute, the values are arriving. <b>Fourth, and this is the real proof:</b> press the button „Daily course“ in the Test tab. It shows hour by hour when the sun stands on which window. If that table does not match what you see at the house, a direction or a horizon is wrong — and you find it there in a minute instead of over a season."
H_TOKEN = "The token"
TOKEN_TEXT = "The token protects the endpoint in the unauthenticated area. Rolling a new one is harmless but makes <b>every address entered in Loxone so far invalid</b> — they answer with HTTP 403 afterwards, both the inputs and the outputs through which the readings arrive. Afterwards create and import both templates again."
K_TOKEN_NEU = "Create a new token"
TOKEN_NEU_OK = "A new token has been created. Please create both templates again and import them into Loxone — the old addresses answer with HTTP 403 from now on."

[TEST]
H = "Self check and tools"
ERKLAERUNG = "This page answers <b>without Loxone</b> whether the setup holds. The most important button is „Self check“: it walks the chain from the language file to the calculation core and says for each point what was measured — not merely that it is fine."
