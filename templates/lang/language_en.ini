[EINST]
H_LAGE = "Current situation"
LAGE_ERKLAERUNG = "One verdict per window, from <b>−100</b> (shade by all means) to <b>+100</b> (let the sun in), plus a digital value for simple wiring. The plugin <b>switches nothing</b>. It supplies what Loxone is missing — whether the solar gain is welcome — and feeds the <span class='sm-mono'>AutoShade</span> input of the AutoJalousie block. Its angle and slat calculation stays untouched."
KEIN_STANDORT = "<b>No location is configured.</b> Without latitude and longitude there is no sun position and therefore no verdict. The location is in the Loxone project file in the <span class='sm-mono'>Document</span> section."
MESSWERTE_FEHLEN = "<b>Valid readings are missing:</b> %s. A reading only counts while it is younger than %d seconds. As long as something is missing, <span class='sm-mono'>FB_OK</span> stays 0 and every verdict stays 0 — nothing is guessed. The readings arrive through the virtual outputs, see the tab „Loxone integration“."
NOCH_NICHTS = "Nothing has been calculated yet. Once location, windows and readings are in place, this table fills up with the next run — after five minutes at the latest."
H_ORT = "Location"
ORT_ERKLAERUNG = "The sun position is calculated, not queried — no service and no internet connection are needed, only the location. Accuracy is within a hundredth of a degree, calibrated against a second independent calculation using the PSA algorithm."
L_BREITE = "Latitude in degrees (north positive)"
L_LAENGE = "Longitude in degrees (east positive)"
H_MODELL = "The model"
MODELL_ERKLAERUNG = "These values decide how sun, room and season turn into a verdict. The defaults are meant for a central European home. <b>Any change shows its effect immediately</b> — saving triggers a fresh calculation, and the table above shows one sentence per window explaining the verdict."
L_TAGESGRENZE = "Day limit in degrees C — above this expected daily maximum heat is a burden"
H_TAGESGRENZE = "<b>This is the single most important value of the whole plugin.</b> It answers the question a switching condition in Loxone gets wrong: not „is it warm outside?“ but „does the house want heat today?“. On 23 Aug 2026 it was 19.5 degrees outside and 32.7 degrees in the living room — the outside air would have said „let it in“, and the day reached 28 degrees. Not to be confused with the heating limit temperature of building physics (typically 15 degrees): that refers to the daily mean, while this is the maximum, which runs about 5 kelvin higher in the transition season."
L_SPREIZUNG_TAG = "Span of the day term in kelvin"
L_SPREIZUNG_RAUM = "Span of the room term in tenths of a kelvin"
H_SPREIZUNG = "Over this span the respective term runs continuously from +1 (heat welcome) to −1 (heat unwanted). A small span makes the verdict hard and jumpy, a large one soft and sluggish. 20 tenths of a kelvin are 2.0 kelvin."
L_GEWICHT_RAUM = "Weight of the room term in percent"
L_GEWICHT_TAG = "Weight of the day term in percent"
H_GEWICHTE = "The two terms are added with weights, not ANDed. An AND would let the room override the season — then September would be closed all day; an OR the other way round — then August would stay open. The sum does not have to be exactly 100, it is normalised anyway. <b>There is one hard cap:</b> a room above its shading limit never receives a positive verdict."
L_SCHWELLE_EIN = "Shade from verdict −x"
L_SCHWELLE_AUS = "Release again from verdict −x"
H_SCHWELLEN = "The two values form a hysteresis. Without it the blind would move up and down every minute at the threshold. The release threshold must be smaller than the shading threshold."
L_E_REF = "Reference irradiance: direct sun at the glass in W/m²"
H_E_REF = "From this value on the verdict counts at full strength, below it proportionally less. <b>What is weighed is the DIRECT share</b>, not the total irradiance at the glass. Reason: sky light and ground reflection are present at every window all day and are almost equal everywhere — on 23 Aug 2026 that was 121 W/m². Counting them in made even the north facing windows demand shading, which no sun reaches at all. The table still shows the full values; only the weight of the verdict depends on the direct share."
L_ALBEDO = "Ground reflection (albedo) in percent"
L_IAM = "Glass coefficient b0 (times 100)"
H_IAM = "The coefficient describes how strongly the glass reflects at oblique incidence (ASHRAE: <span class='sm-mono'>1 − b0 · (1/cos θ − 1)</span>). 10 means b0 = 0.10 and fits clear double glazing. Larger means the glass shuts off earlier at grazing incidence."
L_HOECHSTALTER = "Maximum age of readings in seconds"
H_HOECHSTALTER = "A reading older than this counts as absent — and then nothing is guessed, <span class='sm-mono'>FB_OK</span> goes to 0. The value must be larger than the interval at which Loxone sends. For a daily forecast that changes hourly, 900 seconds is too tight; then a cyclic send in Loxone belongs with it."
L_RECHENTAKT = "Minimum interval between two calculations in seconds"
H_RECHENTAKT = "On a weather change Loxone fires several virtual outputs in the same second. Without a minimum interval the plugin would recalculate for each of them and send a full MQTT burst every time."
H_FENSTER = "The windows"
FENSTER = "Window"
FENSTER_ERKLAERUNG = "One row per window. <b>Counting follows the row number</b>, not the filled rows — a row may stay empty without shifting the numbers below it. A row without a short name is skipped."
L_KUERZEL = "Short name"
L_NAME = "Description"
L_AZIMUT = "Direction"
L_NEIGUNG = "Tilt"
L_FLAECHE = "Glass area m²"
L_GWERT = "g value %"
L_RAUM = "Room key"
L_RAUMWERTE = "use room values"
L_TRAEGHEIT = "Inertia"
L_HORIZONT = "Shading horizon"
L_AKTIV = "Active"
FELDER_HILFE = "<b>Short name</b> — letters, digits and underscore. It becomes the title of the virtual input (<span class='sm-mono'>FB_NAME_URTEIL</span>) and the MQTT branch. <b>Direction</b> — degrees from north clockwise, exactly like the <span class='sm-mono'>Dir</span> parameter of the AutoJalousie block: 0 = north, 90 = east, 180 = south, 270 = west. The values can be taken from the project file unchanged. <b>Tilt</b> — 90 for a vertical window, 0 for a horizontal roof window. <b>Glass area</b> — in square metres, per window. What is meant is the <b>glass</b>, not the opening in the wall: width times height of the pane, about 90 percent of the structural dimension on a standard window. It does <b>not</b> enter the verdict — a small and a large south facing window want the same thing at the same time. But it determines every watt figure, every watt hour and thus the measured heat-up constant; and as soon as the daily balance carries a weight, it does affect the verdict over the day. <b>g value</b> — total solar energy transmittance in percent, 55 to 65 for common double glazing, considerably less for solar control glass. <b>Room key</b> — lower case; under this name Loxone delivers <span class='sm-mono'>ist.&lt;key&gt;</span> and <span class='sm-mono'>grenze.&lt;key&gt;</span>. Several windows may name the same room. <b>Inertia</b> — tenths of a kelvin by which the shading limit is raised; a solid room tolerates an hour of sun, an attic room does not. <b>Shading horizon</b> — support points of the form <span class='sm-mono'>80:22, 110:14, 160:6</span>, read as „from azimuth 80 degrees an obstacle stands 22 degrees high“. Between the points it is interpolated linearly, outside them the nearest point applies. If the sun stands below the obstacle, the direct share falls away — the sky light remains."
FLAECHE_VORGABE = "%d window(s) still carry the default glass area: %s. The verdict is still right — it does not depend on the area. What goes wrong are the watt figures, the daily balance and the measured heat-up constant."
H_RAEUME = "The floor areas of the rooms"
RAEUME_ERKLAERUNG = "Only needed if the daily balance is to carry a weight. It decides at what amount of heat a room counts as full: what heats a room up depends on its mass, and that grows with the floor area. Only rooms named by a window are listed — an area for the garage changes no verdict. Reading the project file fills this table too, because the room areas are in there (the window areas are not)."
RAEUME_KEINE = "No window names a room yet. As soon as a room key appears in the table above, it shows up here."
RAEUME_HILFE = "An <b>empty field</b> means „unknown“ and is something other than a 0 — the assumed area from the model settings then applies, and the explanation sentence says „estimated“. An area entered by hand is not lost when the project file is read again: only empty fields are filled."
L_RAUMFLAECHE = "Floor area m²"
L_RAUM_FENSTER = "Windows in this room"
L_RAUM_SCHWELLE = "counts as full from"
RAUM_GESCHAETZT = "assumed: %.1f m²"
L_GLAETTUNG = "Smoothing of the irradiance in seconds (0 = off)"
H_GLAETTUNG = "The clearness index jumps considerably when clouds pass. Over this span the irradiance is averaged <b>before</b> anything is calculated with it — a single cloud must not upset the calculation, while a real change of weather must get through. This is not the hysteresis above: that one prevents chattering at the threshold, this one chattering of the measured quantity."
L_HIMMELSMODELL = "Sky model"
MODELL_ISOTROP = "isotropic (Liu and Jordan) — simple and forgiving"
MODELL_HDKR = "HDKR — with circumsolar and horizon brightening"
H_HIMMELSMODELL = "The isotropic model spreads the diffuse radiation evenly over the sky. Under a clear sky it is considerably stronger near the sun; HDKR accounts for that and yields roughly five to ten percent more at sun facing windows. <b>It only pays off once the heat-up constant is measured</b> — before that you compare model against model. HDKR can be checked by the fact that under an overcast sky it turns into exactly the isotropic model."
H_VORSCHAU = "Look ahead"
L_VORSCHAU = "Look ahead in seconds (0 = off)"
H_BILANZ = "Daily balance per room"
BILANZ_ERKLAERUNG = "Not the temperature but the <b>amount of heat</b>. A room that has taken in three kilowatt hours since eight in the morning is full — even if the thermometer still says 24 degrees, because the wall is warm and gives it back in the evening. That is exactly what a snapshot lacks, and exactly what this plugin is named after. <b>The weight is 0 by default</b>: look at the watt hours for a week before letting them into the verdict."
L_GEWICHT_BILANZ = "Weight of the daily balance in percent"
L_BILANZ_VOLL = "A room counts as full from … Wh per m² of floor"
L_RAUMFLAECHE_VORGABE = "Assumed floor area of an unknown room in m²"
H_RAUMFLAECHE_VORGABE = "For every room whose floor area was neither entered nor read from the project file. <b>Not 0:</b> a room without extent would be full immediately, and the balance term would sit permanently at −1 without anyone noticing. Where an estimate is used, the explanation sentence of the window says so."
H_BILANZ_VOLL = "At 0 Wh the balance term is +1 (take it), on reaching the threshold −1 (enough). <b>The threshold is multiplied by the floor area of the room</b> — 150 Wh/m² is 750 Wh for a 5 m² bathroom and 3750 Wh for a 25 m² living room. A fixed figure per room would be far too high for the small bathroom and too low for the large one, because what heats a room up depends on its mass. A useful guide: the amount of heat that raises the room by two to three kelvin on a clear day. The table below shows what watt-hour figure this becomes per room."
L_LERNEN = "record the heat-up constant per room"
H_LERNEN = "Records one pair of values per day and room: computed heat input in Wh against the measured temperature span of the day. Over a season this yields the number against which everything else can be calibrated — <b>kelvin per kilowatt hour, measured at this house instead of taken from a model</b>. The recording never enters the verdict."
H_VORABEND = "Evening: tomorrow’s forecast"
VORABEND_ERKLAERUNG = "In the morning tomorrow’s forecast says nothing about whether this sun is welcome now — the house has a night in between. In the late afternoon, however, the heat stays in the house until tomorrow morning: if it gets cooler, it is welcome; if it gets hotter, it is a burden, because the house no longer cools down overnight. <b>Off by default.</b> Switched on, this term requires the reading <span class='sm-mono'>prognose1</span>."
L_GEWICHT_MORGEN = "Weight of the evening term in percent"
L_VORABEND_AB = "Takes effect from hour"
H_DAEMMEN = "Night insulation"
DAEMMEN_ERKLAERUNG = "A closed blind is thermal protection at night — the same energy balance, only with the opposite sign and without sun. Three things are required: the sun is down, it is cold enough, and the day actually <b>wants</b> heat. The third is the important one: on a mild August night a closed blind achieves nothing but a dark room. <b>Off by default</b> — it drives blinds, and that belongs switched on deliberately. Switched on it requires the reading <span class='sm-mono'>aussen</span>."
L_DAEMMEN_EIN = "calculate night insulation"
L_DAEMM_GRENZE = "Only below this outside temperature in degrees C"
L_DAEMMEN = "insulate at night"
H_STELLUNG = "Feedback of the blind position"
STELLUNG_ERKLAERUNG = "The plugin delivers a verdict and otherwise never sees what Loxone made of it. <b>That is exactly how the incident behind this plugin came about</b>: fifteen room controllers reported demand, not one blind moved, and nobody noticed. Switched on, the plugin expects one further virtual output per window, <span class='sm-mono'>stellung.&lt;name&gt;</span> with the position in percent, and reports when demand and reality drift apart."
L_STELLUNG_EIN = "evaluate the position"
L_STELLUNG_ZU = "From this position in percent the blind counts as driven"
L_STELLUNG_FRIST = "Report only after this delay in seconds"
H_STELLUNG_FRIST = "A blind needs its time, and the AutoJalousie block has its own switch-on delay. Without a delay the plugin would report a deviation on every run."
H_BERICHT = "Daily report"
L_BERICHT_EIN = "write a summary into the log once each evening"
L_BERICHT_STUNDE = "Hour of the report"
H_PV = "Cross-check against the PV yield forecast"
PV_ERKLAERUNG = "<b>Not a second weather source</b> — the computed value stays the measured one. Only the daily sums are compared: if the reported irradiance drifts systematically away from the yield forecast over days, the sensor is probably dirty, shaded or misaligned. A warning is issued, nothing is changed. Switched on, the cross-check requires the reading <span class='sm-mono'>pv_prognose</span>."
L_PV_EIN = "compute the cross-check"
L_PV_ABWEICHUNG = "Warn from this deviation in percent"
L_BLEND_HOEHE = "Glare: sun elevation / angle of incidence in degrees"
H_BILD = "Sun path and horizon"
BILD_ERKLAERUNG = "The shading horizon is entered as a row of numbers. Whether those numbers match what you see out of the window, a row of numbers cannot tell you — a picture can, in one second. Drawn is <b>today’s</b> sun arc, because that is the day on which you stand at the window and compare."
BILD_LEGENDE = "Yellow is today’s sun path, the yellow dot its current position. Grey is the configured horizon — <b>where the grey area covers the yellow line, no direct sun falls on this window</b>. The green band is the range a vertical window can see at all; the dashed line is its direction."
OHNE_HORIZONT = "no horizon configured"

[MQTT]
ERKLAERUNG = "The MQTT gateway has been part of the system since LoxBerry 3 and is not a plugin. The plugin sends its values through the UDP input of the gateway, which creates the virtual inputs in the Miniserver itself. The HTTP route through the endpoint runs alongside and delivers the same values."
NICHT_GEFUNDEN = "The MQTT gateway was not found. There is no <span class='sm-mono'>Mqtt</span> section in <span class='sm-mono'>config/system/general.json</span>. Please set it up under System → MQTT Gateway."
KEIN_AUTOSTART = "The MQTT gateway is not set to autostart (System → MQTT Gateway). Values are sent, but probably nobody is listening."
LAEUFT = "The MQTT gateway is configured and starts on its own. The UDP input listens on port %s."
H_ABO = "The subscription"
ABO_V1 = "<b>The subscription <span class='sm-mono'>%s/#</span> must be entered in the MQTT gateway</b> (System → MQTT Gateway → Subscriptions). Without that entry nothing arrives at the Miniserver. This is by far the most common cause of failure."
ABO_V2 = "This gateway runs version 2. <b>Nothing is to be entered by hand</b> there: the topic group <span class='sm-mono'>%s</span> appears in the subscriptions on its own, and the desired data points are ticked there."
EIN = "send values over MQTT"
THEMA = "Topic prefix"
THEMA_HILFE = "All topics start with it. Allowed are lower case letters, digits, hyphen, underscore and the slash."
H_THEMEN = "The published topics"
SP_THEMA = "Topic"
SP_BEDEUTUNG = "Meaning"
SP_ZAHL = "Number"
KUERZEL_HILFE = "<span class='sm-mono'>&lt;kuerzel&gt;</span> stands for the short name of the respective window from the settings tab — one branch per configured window. <span class='sm-mono'>begruendung</span> is text and can only be used as text in Loxone, not as an analogue value."
H_GRUND = "The numbers behind <span class='sm-mono'>grund</span>"

[LOX]
H = "Loxone integration"
S1 = "<b>Step 1 — choose the route.</b> MQTT is the standard route: the gateway creates the names of the virtual inputs itself, in Loxone a suitably named input is enough. The HTTP route through the endpoint is the fallback and delivers the same figures in a text line. Both may run at the same time."
S2_V1 = "<b>Step 2 — enter the subscription.</b> Under System → MQTT Gateway → Subscriptions add the line <span class='sm-mono'>%s/#</span>. Without that entry nothing arrives at the Miniserver."
S2_V2 = "<b>Step 2 — enter nothing.</b> This gateway runs version 2: the topic group <span class='sm-mono'>%s</span> appears in the subscriptions on its own, and the data points are ticked there."
H_MESSWERTE = "Step 3 — feed the readings in"
MESSWERTE_TEXT = "<b>Without this step the plugin calculates nothing.</b> It measures nothing itself: irradiance, outside temperature, daily forecast and the room values come from the Miniserver. For that <b>one virtual output</b> is created in Loxone whose commands push the values to the endpoint. The button below produces the ready made import file. In Loxone each of these commands is fed with the respective value; for the daily forecast the maximum temperature t+0 from Weather4Loxone fits, for the shading limit the parameter <span class='sm-mono'>TShadeHeat</span> of the room controller. <b>Important:</b> Loxone only sends a virtual output on value change. A quantity that does not change for hours eventually counts as stale here — so add a cyclic pulse in Loxone or choose the maximum age accordingly."
SP_BEFEHL = "Command on ON"
SP_EINGETROFFEN = "Last received"
VOR_SEKUNDEN = "%d s ago: %s"
NIE_EINGETROFFEN = "never"
OPTIONAL = "optional"
KEINE_RAEUME = "No window with room values is configured yet — so only the four general quantities are listed above."
K_VQ = "Create template for the reading outputs"
H_ADRESSE = "The endpoint addresses"
ADRESSE_HILFE = "These addresses are complete and can be copied unchanged — including the token. <b>If the token is re-rolled, all three change</b> and the old addresses answer with HTTP 403. The host name is a suggestion: what counts is the name under which the Miniserver reaches this LoxBerry."
SP_ZWECK = "Purpose"
SP_ADRESSE = "Address"
Z_STATUS = "All values as text lines (this is the address of the input template)"
Z_JSON = "The same as JSON, including the explanation per window"
Z_SELFTEST = "Self test — answers the token question without triggering anything"
TOKEN_HINWEIS = "Even the read-only calls require a token. Reason: the answer contains room temperatures. That is no trade secret, but it tells everybody on the home network whether someone is at home."
H_FELDER = "Step 4 — the virtual inputs"
FELDER_HILFE = "Four values per window plus nine summary values. <b>Minimum and maximum are not decoration:</b> Loxone clips a value to the limits of the virtual input, and it does so silently. A verdict with minimum 0 would arrive as 0 from every window that needs shading — that is exactly the value meaning „no opinion“."
SP_TITEL = "Title"
SP_EINHEIT = "Unit"
SP_BEREICH = "Min … Max"
SP_BEDEUTUNG = "Meaning"
KEINE_FENSTER = "No window is configured yet. The template would then contain only the summary values."
H_ALLES = "Create everything at once"
ALLES_TEXT = "The button creates an import file for Loxone Config with all virtual inputs including title, comment, unit and limits. Read it in through <b>File → Import template</b> in Loxone Config. <b>Loxone Config creates new objects on import and overwrites nothing</b> — importing twice means duplicate objects."
K_VI = "Create template for Loxone Config"
FEHLER_VORLAGE = "The template could not be created. Is at least one window configured?"
H_AUSFALL = "Step 5 — failure detection"
AUSFALL_TEXT = "Virtual inputs keep their last value. If the plugin stops, everything looks normal in the app — the blinds would stay wherever they last were. Two values guard against that: <span class='sm-mono'>FB_HERZ</span> counts the minutes since the last run and is <b>−1</b> as long as nothing has been calculated; <span class='sm-mono'>FB_OK</span> goes to 0 as soon as a reading is missing or stale. <b>Both belong in the Loxone logic</b>, and in such a way that on failure the AutoJalousie block falls back to its own release condition. The plugin itself falls back to „no opinion“ in that case: verdict 0, shading 0."
H_BAUSTEINE = "Step 6 — the blocks to rebuild"
BAUSTEINE = "<table class='sm-tbl'><tr><th>#</th><th>Block (type)</th><th>Name (suggestion)</th><th>Parameters</th><th>Connect inputs to</th></tr><tr><td>1</td><td>Status block</td><td>Window balance valid</td><td>—</td><td><span class='sm-mono'>FB_OK</span></td></tr><tr><td>2</td><td>Analogue comparator</td><td>Window balance stalled</td><td>greater than 15, on delay 300 s</td><td><span class='sm-mono'>FB_HERZ</span></td></tr><tr><td>3</td><td>OR</td><td>Window balance unusable</td><td>—</td><td>output of #2 and the inverted <span class='sm-mono'>FB_OK</span></td></tr><tr><td>4</td><td>Notification block (optional)</td><td>Window balance message</td><td>subject and text free</td><td>#3 — and <b>only</b> #3</td></tr><tr><td>5</td><td>OR</td><td>Shading release per window</td><td>one per window</td><td><span class='sm-mono'>FB_&lt;name&gt;_BESCHATTEN</span> and the previous release path, ANDed with #3</td></tr><tr><td>6</td><td>AutoJalousie</td><td>already present, is not replaced</td><td><span class='sm-mono'>Dir</span>, <span class='sm-mono'>DirTol</span>, <span class='sm-mono'>AutoShadeTime</span> stay unchanged</td><td>input <span class='sm-mono'>AutoShade</span> ← output of #5</td></tr><tr><td>7</td><td>Statistics</td><td>Verdict per window</td><td>analogue value, recording every 5 minutes</td><td><span class='sm-mono'>FB_&lt;name&gt;_URTEIL</span></td></tr><tr><td>8</td><td>Statistics (optional)</td><td>Gain per window</td><td>analogue value in watts</td><td><span class='sm-mono'>FB_&lt;name&gt;_WATT</span></td></tr><tr><td>9</td><td>Status block (optional)</td><td>Why shaded</td><td>text per number, see the table in the MQTT tab</td><td><span class='sm-mono'>FB_&lt;name&gt;_GRUND</span></td></tr><tr><td>10</td><td>Virtual output</td><td>Window balance readings</td><td>from the template in step 3</td><td>values for irradiance, outside temperature, forecast and per room actual and limit</td></tr></table>"
BAUSTEINE_ERL = "<b>On #2:</b> The threshold is 15 minutes, three times the cron interval. Set tighter it reports on every missed run, and after the third message nobody looks any more. <b>On #3 and #5:</b> This is the most important connection in the whole list. The plugin may only have a say while its values are valid — otherwise the previous release condition must continue alone. Building #5 without the AND leaves you with shading frozen in its last position if the LoxBerry fails. <b>On #4:</b> The notification block only fires on the transition from off to on. Never connect several sources directly to its input — merge them through the OR first, otherwise a permanently pending source swallows all the others. <b>On #6:</b> The AutoJalousie block is <b>not replaced</b>. Its angle and slat calculation is good; what it lacks is the judgement whether the heat is welcome. That is what this plugin supplies, and only at <span class='sm-mono'>AutoShade</span>. <b>On #7:</b> The statistics over the verdict is the most useful value of the whole plugin. Looking at it after a week shows immediately whether day limit and weights fit — before changing them. <b>On #10:</b> Loxone only sends a virtual output on value change. A forecast that does not move for hours eventually counts as stale here; a cyclic pulse every ten minutes costs nothing and saves the search. <b>Loxone time:</b> Loxone counts seconds since 01 Jan 2009. When calculating with <span class='sm-mono'>FB_TS</span>, subtract <span class='sm-mono'>1230768000</span> from the Loxone time. All blocks can be found in Loxone Config through the block search with <b>F5</b>."
H_GEGENPROBE = "Step 7 — the cross check"
GEGENPROBE_TEXT = "<b>First:</b> look at the column „Last received“ in the tab „Loxone integration“. If a quantity says „never“, the virtual output is not sending — then the address is wrong or the token is stale. <b>Second:</b> press the button „Self check“ in the Test tab. It answers in a list whether the setup holds. <b>Third:</b> watch one of the virtual inputs in the Loxone Config monitor. If <span class='sm-mono'>FB_HERZ</span> changes every minute, the values are arriving. <b>Fourth, and this is the real proof:</b> press the button „Daily course“ in the Test tab. It shows hour by hour when the sun stands on which window. If that table does not match what you see at the house, a direction or a horizon is wrong — and you find it there in a minute instead of over a season."
H_TOKEN = "The token"
TOKEN_TEXT = "The token protects the endpoint in the unauthenticated area. Rolling a new one is harmless but makes <b>every address entered in Loxone so far invalid</b> — they answer with HTTP 403 afterwards, both the inputs and the outputs through which the readings arrive. Afterwards create and import both templates again."
K_TOKEN_NEU = "Create a new token"
TOKEN_NEU_OK = "A new token has been created. Please create both templates again and import them into Loxone — the old addresses answer with HTTP 403 from now on."

