; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der Hilfe.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst
; keine; Auszeichnung bleibt roh, die Hilfe wird nicht maskiert ausgegeben.

[HILFE]
K01 = "Beschattung Fensterbilanz"
K02 = "Am 23.08.2026 um 10:00 Uhr standen in diesem Haus 662 W/m² Sonne, 19,5 Grad Außenluft und 32,7 Grad im Wohnzimmer bei 28 Grad Sollwert. Alle fünfzehn Raumregler meldeten Beschattungsbedarf. Gefahren wurde kein einziger Rollladen — die Freigabe verlangte 23 Grad Außenluft, und die waren nicht da."
K03 = "Die Freigabe war nicht kaputt. Sie fragte die falsche Größe. Das Problem ist der Sonneneintrag durchs Glas, gefragt wurde die Lufttemperatur. Genau diese Lücke füllt dieses Plugin: es rechnet je Fenster aus, wie viel Wärme gerade hereinkommt, und urteilt, ob sie erwünscht ist."
K04 = "Was das Plugin NICHT tut"
K05 = "<b>Es schaltet nichts.</b> Kein Rollladen wird von hier gefahren. Das Urteil geht nach Loxone, und dort entscheidet der AutoJalousie-Baustein. Ein Plugin, das Rollläden fährt, ist bei einem Netzausfall eine Gefahr und bei einem eigenen Fehler nicht abschaltbar."
K06 = "<b>Es ersetzt den AutoJalousie nicht.</b> Dessen Winkel- und Lamellenrechnung ist gut. Was ihm fehlt, ist das Urteil darüber, ob der Eintrag erwünscht ist — und nur das liefert dieses Plugin, an seinen Eingang <span class='sm-mono'>AutoShade</span>. <b>Und es misst nichts selbst:</b> Strahlung, Temperaturen und Prognose kommen aus dem Miniserver. Eine zweite Wetterquelle wäre nur eine dritte Meinung."
K07 = "Die Rechnung in vier Schritten"
K08 = "Je Fenster und Lauf entsteht eine Zahl von −100 (unbedingt beschatten) bis +100 (Sonne hereinlassen):"
K09 = "<b>Geometrie.</b> Der Sonnenstand wird aus Ort und Zeit gerechnet — kein Dienst, kein Netz, reine Rechnung nach dem NOAA-Verfahren. Daraus der Einfallswinkel auf das Glas. Bei streifendem Einfall spiegelt das Glas den größten Teil weg; ein Winkelbereich allein lässt vermuten, es komme viel herein."
K10 = "<b>Verschattung.</b> Steht die Sonne unter dem eingetragenen Horizont — Nachbarhaus, Baum, Dachüberstand —, fällt der direkte Anteil weg. Das Himmelslicht bleibt: wer auch das streicht, rechnet ein dunkles Zimmer aus, das es nicht gibt."
K11 = "<b>Wärmebedarf.</b> Bis zu vier Teile, jeder stetig von +1 nach −1 und gewichtet addiert. Der <b>Raumteil</b> vergleicht die Raumtemperatur mit der Beschattungsgrenze des Raumes — in Loxone der Parameter <span class='sm-mono'>TShadeHeat</span>, nicht der Heizsollwert. Der <b>Tagesteil</b> vergleicht den erwarteten Tageshöchstwert mit der Tagesgrenze. Dazu kommen wahlweise die <b>Tagesbilanz</b> des Raumes in Wattstunden je Quadratmeter Grundfläche und die <b>Prognose für morgen</b>; beide stehen ab Werk auf Gewicht 0, weil man eine Größe erst ansehen soll, bevor man sie entscheiden lässt."
K12 = "<b>Urteil.</b> Der Wärmebedarf mal dem Gewicht des Eintrags. Das Gewicht folgt der <b>direkten</b> Strahlung auf das Glas: ein Nordfenster bekommt Himmelslicht, aber nichts, worüber zu entscheiden wäre, und sein Urteil bleibt 0."
K13 = "Dazu kommt je Fenster ein Satz, der das Urteil begründet — mit Sonnenhöhe, Einfallswinkel, Watt am Glas, Raumtemperatur und Tagesprognose. Wer nicht sieht, warum ein Fenster beschattet wird, schaltet das Plugin nach der ersten Überraschung ab."
K14 = "Warum die Tagesprognose und nicht die Außenluft"
K15 = "Das ist der Kern der Sache. Im Juli ist der Eintrag Last, selbst bei 19 Grad Außenluft am Morgen — denn der Tag wird 28. Im September ist er willkommen, auch wenn der Raum noch warm ist — denn der Tag wird 16. <b>Die Außenluft im Augenblick beantwortet diese Frage nicht.</b>"
K16 = "Die Tagesgrenze ist deshalb der erwartete Tageshöchstwert, ab dem Wärme Last wird — Vorgabe 20 Grad. Nicht zu verwechseln mit der Heizgrenztemperatur der Bauphysik (üblich 15 Grad): die bezieht sich auf das Tagesmittel, hier steht der Höchstwert, und der liegt in der Übergangszeit rund fünf Kelvin darüber. Als Quelle eignet sich die Höchsttemperatur t+0 aus Weather4Loxone."
K35 = "Vorausschau: das Urteil für in einer halben Stunde"
K36 = "Ein Rollladen braucht seine Fahrzeit, und der AutoJalousie wartet zusätzlich seine Verzögerung ab, damit nicht jede Wolke etwas auslöst. Ein Plugin, das nur den Augenblick meldet, beschattet dadurch <b>systematisch zu spät</b>. Deshalb läuft dieselbe Rechnung ein zweites Mal für den Zeitpunkt in einer halben Stunde und geht als eigene Werte hinaus: <span class='sm-mono'>FB_&lt;kürzel&gt;_URTEIL30</span> und <span class='sm-mono'>FB_&lt;kürzel&gt;_BESCHATTEN30</span>."
K37 = "Entscheidend ist, was dabei <b>nicht</b> geschieht: es wandert allein die Sonne, die Messwerte bleiben stehen. Das ist keine Wettervorhersage, sondern reine Geometrie — und damit genauso verlässlich wie der Sonnenstand selbst. In Loxone verknüpft man beide Werte mit ODER: gefahren wird, sobald einer von beiden es fordert. Zieht inzwischen eine Wolke auf, ist der Wert eine halbe Stunde später ohnehin ein anderer. Die Vorausschau lässt sich mit 0 Sekunden abschalten; dann entstehen auch ihre virtuellen Eingänge nicht."
K38 = "Blendung, Nachtdämmung und Rückmeldung"
K39 = "Drei Aussagen stehen <b>neben</b> dem Urteil und werden mit Absicht nicht hineingemischt. Wer sie zusammenrührt, kann hinterher nicht mehr sagen, warum ein Fenster zu ist — und genau diese Unerklärbarkeit war der Anlass für dieses Plugin. Jede der drei ist einzeln abschaltbar und erzeugt nur dann virtuelle Eingänge, wenn sie eingeschaltet ist."
K40 = "<b>Blendung</b> (<span class='sm-mono'>FB_&lt;kürzel&gt;_BLENDUNG</span>). Steht die Sonne tief und trifft das Fenster frontal, blendet sie — auch im Januar, wenn die Wärme hochwillkommen ist. Das Urteil sagt dann zu Recht „hereinlassen“, und trotzdem will man am Schreibtisch die Lamellen stellen. Wirksam wird das je Fenster nur mit einer eingetragenen Blendhöhe."
K41 = "<b>Nachtdämmung</b> (<span class='sm-mono'>FB_&lt;kürzel&gt;_DAEMMEN</span>). Ein geschlossener Rollladen ist nachts Wärmeschutz: dieselbe Energiebilanz, nur mit umgekehrtem Vorzeichen und ohne Sonne. Braucht die Außentemperatur und steht ab Werk aus — sie fährt Rollläden, und das gehört bewusst eingeschaltet."
K42 = "<b>Rückmeldung</b> (<span class='sm-mono'>FB_&lt;kürzel&gt;_GEFAHREN</span>). Hat Loxone die Forderung überhaupt umgesetzt? Ohne diese Antwort liefert das Plugin ein Urteil und sieht nie, was daraus wurde — der Zustand, aus dem der Vorfall vom 23.08. entstanden ist. Der Wert −1 heißt <b>keine Rückmeldung</b> und ist etwas anderes als 0 („steht falsch“); gemeldet wird erst nach einer Frist, damit die Fahrzeit nicht als Fehler zählt."
K17 = "Was das Plugin von außen braucht"
K18 = "Zwei Größen immer, je Raum zwei weitere, und je eine für jede zusätzlich eingeschaltete Funktion. Sie kommen über einen virtuellen Ausgang aus Loxone; die fertige Importdatei erzeugt der Reiter Einbindung in Loxone. Was nicht eingeschaltet ist, wird auch nicht verlangt."
K19 = "<span class='sm-mono'>strahlung</span> — Globalstrahlung auf die Waagerechte in W/m². In dieser Anlage der Leitwert aus Ecowitt und Weather4Loxone."
K21 = "<span class='sm-mono'>prognose</span> — erwarteter Tageshöchstwert. Das ist die Größe, die alles trägt."
K22 = "<span class='sm-mono'>ist.&lt;raum&gt;</span> und <span class='sm-mono'>grenze.&lt;raum&gt;</span> — Raumtemperatur und Beschattungsgrenze. Mehrere Fenster dürfen denselben Raum nennen."
K63 = "<b>Einen Auszug einfügen (empfohlen).</b> Die Projektdatei ist knapp vier Megabyte groß; was das Plugin daraus braucht, sind rund zweieinhalb Kilobyte. Das mitgelieferte PowerShell-Skript — im Reiter Einstellungen zum Herunterladen — liest sie auf dem eigenen Rechner aus und legt den Auszug in die Zwischenablage. Einfügen, Knopf drücken. Dieser Weg braucht weder eine Absendung noch eine Datei auf dem LoxBerry und geht deshalb auch dann, wenn der Dateimanager streikt."
K58 = "Die Projektdatei: zwei Wege, und der bequemere scheitert meist"
K59 = "Die Fensterliste lässt sich aus der Loxone-Projektdatei füllen. Für die Übergabe der Datei gibt es zwei Wege:"
K60 = "<b>Auf den LoxBerry legen (empfohlen).</b> Kopieren Sie die <span class='sm-mono'>.Loxone</span>-Datei über die Windows-Freigabe, mit WinSCP oder per <span class='sm-mono'>scp</span> nach <span class='sm-mono'>data/plugins/fensterbilanz/</span>. Sie steht dann im Reiter Einstellungen zur Auswahl. <b>Auf diesem Weg gibt es keine Größenbeschränkung</b>, weil nichts abgesendet wird — das Plugin liest die Datei geradewegs aus dem Dateisystem."
K61 = "<b>Über den Browser absenden.</b> Bequemer, scheitert aber auf den meisten Anlagen: PHP nimmt ab Werk 2 MB je Datei an, und eine Loxone-Projektdatei ist 3 bis 4 MB groß. Die Meldung lautet dann „Fehlernummer 1“."
K62 = "<b>Warum das Plugin die Grenze nicht einfach anhebt:</b> <span class='sm-mono'>upload_max_filesize</span> und <span class='sm-mono'>post_max_size</span> gelten je Verzeichnis und lassen sich aus einem laufenden Skript nicht ändern — <span class='sm-mono'>ini_set()</span> gibt für beide eine Fehlanzeige zurück, gemessen mit PHP 7.4.33 und 8.4.24. Selbst wenn es ginge, wäre es zu spät: PHP weist die Absendung ab, bevor die erste Zeile des Plugins läuft. Die beiden Werte <b>liest</b> das Plugin sehr wohl selbst und zeigt sie <b>vor</b> dem Formular an, statt Sie erst nach einem vergeblichen Versuch damit zu behelligen. Wer sie dennoch anheben will, findet sie in der php.ini des LoxBerry."
K54 = "Die Glasfläche: die eine Zahl, deren Fehlen nie auffällt"
K55 = "Je Fenster steht in der Fensterliste eine <b>Glasfläche in Quadratmetern</b>. Gemeint ist das Glas, nicht das Mauerloch: Breite mal Höhe der Scheibe, bei einem Standardfenster rund 90 Prozent des Rohbaumaßes. Sie steht dort seit der ersten Fassung — und wird trotzdem regelmäßig übersehen, weil das Plugin auch ohne sie ein richtiges Urteil liefert."
K56 = "Das ist kein Zufall, sondern Absicht: <b>das Urteil hängt nicht an der Fläche.</b> Gerechnet wird in Watt je Quadratmeter, und ein kleines und ein großes Südfenster wollen zur selben Zeit dasselbe. Falsch wird durch eine vergessene Fläche etwas anderes — jede Wattzahl, jede Wattstunde, die Tagesbilanz und vor allem die gemessene <b>Aufheizkonstante</b>. Die ist der einzige Punkt, an dem dieses Plugin sein Modell an der Wirklichkeit misst; aus lauter Vorgabeflächen fällt eine Zahl mit zwei Nachkommastellen, die nichts bedeutet. Und sobald die Tagesbilanz ein Gewicht bekommt, wirkt die Fläche über den Tag doch auf das Urteil."
K57 = "Weil das im Betrieb nie auffällt, sagt es das Plugin von sich aus: die Fensterliste weist auf jede Zeile hin, die noch auf der Vorgabe steht, und der Reiter Test schreibt es <b>vor</b> die Aufheizkonstante statt dahinter. <b>Aus der Projektdatei kommt die Glasfläche nicht</b> — der AutoJalousie-Baustein führt die Richtung und die Lamellenmaße (Breite und Abstand in Millimetern, an dieser Anlage bei allen 25 Rollläden identisch), aber keine Fenstermaße. Was die Projektdatei sehr wohl liefert, sind die <b>Grundflächen der Räume</b>, und die entscheiden, ab welcher Wärmemenge ein Raum als voll gilt: 150 Wh je Quadratmeter sind für ein 5-Quadratmeter-Bad 750 Wh und für ein 25-Quadratmeter-Wohnzimmer 3750 Wh."
K20 = "<span class='sm-mono'>aussen</span> — Außentemperatur. <b>Freiwillig</b>, solange die Nachtdämmung aus ist: sie geht dann nicht in das Urteil ein, steht aber in der Begründung und im Protokoll. Fällt der Außenfühler aus, verliert das Haus deswegen nicht die Beschattung."
K43 = "<span class='sm-mono'>prognose1</span> — erwarteter Tageshöchstwert für <b>morgen</b>. Nur nötig, wenn der Vorabend-Term ein Gewicht hat. In der Fassung 0.9.0 stand dieser Wert schon einmal in der Liste und wurde wieder entfernt, weil ihn niemand las; jetzt steht er da, seit er wirklich etwas bewirkt."
K44 = "<span class='sm-mono'>pv_prognose</span> — die Ertragsprognose der Solaranlage als Vergleichsgröße zur gemeldeten Strahlung. Nur nötig bei eingeschalteter Gegenprobe."
K45 = "<span class='sm-mono'>stellung.&lt;kürzel&gt;</span> — die tatsächliche Rollladenstellung in Prozent, je Fenster. Nur nötig bei eingeschalteter Rückmeldung."
K23 = "Fail closed: fehlt ein Wert, gibt es kein Urteil"
K24 = "Ein Messwert gilt nur, solange er jünger ist als das eingestellte Höchstalter. Fehlt einer oder ist er zu alt, wird <b>nicht geraten</b>: das Urteil bleibt 0, Beschatten bleibt 0, und <span class='sm-mono'>FB_OK</span> geht auf 0. In Loxone greift dann wieder die eigene Freigabe des AutoJalousie."
K25 = "Das ist die sichere Richtung. Ein Plugin, das bei fehlenden Daten „beschatten“ sagt, verdunkelt das Haus, sobald ein Kabel wackelt. <b>Achtung:</b> Loxone sendet einen virtuellen Ausgang nur bei Wertänderung. Eine Prognose, die sich stundenlang nicht rührt, gilt hier irgendwann als veraltet — deshalb gehört in Loxone ein zyklischer Impuls dazu."
K46 = "Dasselbe gilt für einen <b>unmöglichen</b> Wert. 662 W/m² bei zwei Grad Sonnenhöhe sind kein Messwert, sondern ein Defekt: mehr als die Sonne bei diesem Stand überhaupt liefern kann. Solche Werte werden verworfen und gemeldet, nicht auf das gerade noch Mögliche zurechtgebogen — ein geklemmter Wert sähe hinterher aus wie ein gemessener."
K26 = "Der Verschattungshorizont"
K27 = "Je Fenster eine Handvoll Stützpunkte der Form <span class='sm-mono'>80:22, 110:14, 160:6</span>, gelesen als „ab Azimut 80 Grad steht ein Hindernis 22 Grad hoch“. Zwischen den Punkten wird linear gerechnet, außerhalb gilt der jeweils nächste Punkt — nicht Null, denn wer nur den Ostsektor eingetragen hat, meint damit nichts über Westen."
K28 = "Wie stark das wirkt, zeigt das Balkonmodul dieser Anlage: nach Osten ausgerichtet, morgens vom Nachbarhaus verschattet, Tagesspitze erst am späten Vormittag. Ein Winkelbereich allein bildet das nicht ab — der AutoJalousie beschattet dann ein Fenster, auf das gar keine Sonne fällt. Die Werte lassen sich mit einer Kompass-App und einem Neigungsmesser am Fenster in wenigen Minuten aufnehmen."
K47 = "Ob sie stimmen, sieht man in einem Bild statt in Zahlenkolonnen: der Reiter Einstellungen zeichnet je Fenster <b>Sonnenbahn und Horizont</b> übereinander. Wo die graue Fläche die Bahn überdeckt, fällt an diesem Fenster keine direkte Sonne ein. Passt das Bild nicht zu dem, was man aus dem Fenster sieht, stimmt eine Himmelsrichtung oder ein Horizont nicht — und man findet es dort in einer Minute statt über eine Saison."
K48 = "Was über die Zeit dazukommt"
K49 = "Drei Dateien überstehen jedes Update mit Absicht, denn in ihnen steht, was sich nicht nachrechnen lässt. Die <b>Tagesbilanz</b> zählt je Fenster und je Raum die Wattstunden des laufenden Tages: ein Zimmer, das seit acht Uhr drei Kilowattstunden geschluckt hat, ist voll, auch wenn das Thermometer erst 24 Grad zeigt. Sie steht von Anfang an in der Vorlage — ansehen soll man sie sofort, ins Urteil lassen erst, wenn man sie kennt."
K50 = "Daraus entsteht die <b>Aufheizkonstante</b> je Raum in Kelvin je Kilowattstunde, an dieser Anlage gemessen statt geschätzt. Ausgeglichen wird durch den Ursprung — ohne Wärme keine Erwärmung. Angezeigt wird sie mit der Zahl der Tage und der Streuung: eine Konstante aus fünf Tagen ist keine, und das soll man sehen können, statt es glauben zu müssen."
K51 = "Der <b>Tagesbericht</b> fasst einmal am Abend zusammen, wie viel Sonne hereinkam, wie viele Fenster beschattet waren, welches am längsten und wo die Spitze lag. Die <b>Gegenprobe gegen die PV-Ertragsprognose</b> schließlich ist ausdrücklich keine zweite Wetterquelle: der gerechnete Wert bleibt der gemessene. Läuft die gemeldete Strahlung über Tage von der Prognose weg, ist wahrscheinlich der Geber verschmutzt, verschattet oder verstellt. Gewarnt wird, eingegriffen nicht."
K29 = "Wie genau ist das?"
K30 = "Der Sonnenstand ist auf ein Hundertstel Grad genau; geeicht gegen eine zweite, unabhängige Rechnung nach dem PSA-Algorithmus an 73 Punkten über vier Jahreszeiten. Die Eichung hat beim Bau einen echten Fehler gefunden: der Azimut war an der Nord-Süd-Achse gespiegelt, während die Sonnenhöhe auf 0,007 Grad stimmte — jedes Ostfenster wäre mit einem Westfenster vertauscht worden."
K31 = "<b>Alles Übrige ist Modell, keine Messung.</b> Die Aufteilung der Globalstrahlung in direkten und diffusen Anteil folgt der Korrelation von Erbs, Klein und Duffie (1982), die Einfallswinkelabhängigkeit dem ASHRAE-Korrekturglied. Für die Strahlung auf das geneigte Glas stehen zwei Himmelsmodelle zur Wahl: das isotrope nach Liu und Jordan und <b>HDKR</b> nach Hay, Davies, Klucher und Reindl, das zusätzlich den Sonnenkranz und die Horizontaufhellung kennt. Ab Werk läuft das isotrope, denn es ist das, gegen das alles andere geeicht ist."
K52 = "<b>Warum HDKR und nicht Perez.</b> Perez wäre genauer, verlangt aber eine Tabelle mit achtundvierzig veröffentlichten Koeffizienten. Die hätten hier aus dem Gedächtnis hingeschrieben werden müssen, ohne sie gegen eine zweite Quelle halten zu können — und eine falsche Ziffer darin sähe genauso aus wie eine richtige. HDKR kommt ohne eine einzige abgeschriebene Zahl aus und hat zwei Eigenschaften, an denen es sich prüfen lässt: bei bedecktem Himmel geht es exakt in das isotrope Modell über, und auf einer waagerechten Fläche ergeben Himmel und Sonnenkranz zusammen genau die Diffusstrahlung. Beides prüft der Selbsttest. Für die Frage „will ich diese Wärme?“ reicht das bei weitem — für eine Ertragsprognose nicht."
K32 = "Einrichten in vier Schritten"
K33 = "<b>Erstens</b> im Reiter Einstellungen den Standort eintragen — ohne ihn wird nichts gerechnet. <b>Zweitens</b> die Fensterliste füllen: entweder von Hand je Fenster eine Zeile mit Kürzel, Himmelsrichtung (dieselbe Zahl wie <span class='sm-mono'>Dir</span> im AutoJalousie), Fläche, g-Wert und Raumschlüssel — oder die Projektdatei einlesen. Der Knopf dafür liest eine hochgeladene <span class='sm-mono'>.Loxone</span>-Datei, sucht alle AutoJalousie-Bausteine und schlägt Kürzel, Himmelsrichtung und Raum vor. Übernommen wird nur in <b>leere</b> Zeilen; Fläche, g-Wert und Horizont ergänzt man von Hand. <b>Drittens</b> im Reiter Einbindung in Loxone <b>beide</b> Vorlagen herunterladen und einlesen — die Ausgangs-Vorlage liefert die Messwerte herein, ohne sie rechnet das Plugin nichts. <b>Viertens</b> im Reiter Test die Selbstprüfung drücken."
K53 = "Zum Ausprobieren gibt es dort außerdem den <b>Tagesgang</b> — stundenweise, welches Fenster wann Sonne hat — und <b>Was wäre, wenn</b>: das ganze Modell mit anderen Grenzen und Gewichten durchrechnen, <b>ohne zu speichern</b>. Gerechnet wird mit den tatsächlichen Messwerten von jetzt, daneben steht zum Vergleich der Stand aus der gespeicherten Einstellung. So probiert man eine Änderung aus, bevor sie das Haus betrifft."
K34 = "Und dann eine Woche lang nichts ändern, sondern in Loxone eine Statistik über <span class='sm-mono'>FB_&lt;kürzel&gt;_URTEIL</span> laufen lassen. Danach sieht man in einem Bild, ob Tagesgrenze und Gewichte passen — und ändert sie einmal richtig statt dreimal nach Gefühl."
