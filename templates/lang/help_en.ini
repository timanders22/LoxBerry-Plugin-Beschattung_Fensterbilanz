; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is in double quotes and contains none itself; markup stays
; raw, the help is not escaped on output.

[HILFE]
K01 = "Window Balance Shading"
K02 = "On 23 August 2026 at 10:00 this house had 662 W/m² of sun, 19.5 degrees outside air and 32.7 degrees in the living room against a 28 degree set point. All fifteen room controllers reported a shading demand. Not a single blind moved — the release condition required 23 degrees outside air, and that was not there."
K03 = "The release condition was not broken. It asked the wrong quantity. The problem is the solar gain through the glass, while what was asked was the air temperature. This plugin fills exactly that gap: it calculates per window how much heat is coming in right now and judges whether it is welcome."
K04 = "What the plugin does NOT do"
K05 = "<b>It switches nothing.</b> No blind is driven from here. The verdict goes to Loxone, and the AutoJalousie block decides there. A plugin that drives blinds is a hazard during a power cut and cannot be switched off when it has a fault of its own."
K06 = "<b>It does not replace the AutoJalousie block.</b> Its angle and slat calculation is good. What it lacks is the judgement whether the gain is welcome — and that is all this plugin supplies, at its <span class='sm-mono'>AutoShade</span> input. <b>And it measures nothing itself:</b> irradiance, temperatures and forecast come from the Miniserver. A second weather source would only be a third opinion."
K07 = "The calculation in four steps"
K08 = "Per window and run a number from −100 (shade by all means) to +100 (let the sun in) is produced:"
K09 = "<b>Geometry.</b> The sun position is calculated from location and time — no service, no network, pure arithmetic following the NOAA method. From that the angle of incidence on the glass. At grazing incidence the glass reflects most of it away; an angular range alone suggests that a lot is coming in."
K10 = "<b>Shading.</b> If the sun stands below the configured horizon — neighbouring house, tree, roof overhang — the direct share falls away. The sky light remains: cancelling that too would compute a dark room that does not exist."
K11 = "<b>Heat demand.</b> Up to four terms, each running continuously from +1 to −1 and added with weights. The <b>room term</b> compares the room temperature to the shading limit of the room — the parameter <span class='sm-mono'>TShadeHeat</span> in Loxone, not the heating set point. The <b>day term</b> compares the expected daily maximum to the day limit. Optionally the <b>daily balance</b> of the room in watt hours per square metre of floor and the <b>forecast for tomorrow</b> join in; both carry weight 0 by default, because a quantity should be looked at before it is allowed to decide."
K12 = "<b>Verdict.</b> The heat demand times the weight of the gain. The weight follows the <b>direct</b> irradiance on the glass: a north facing window receives sky light but nothing worth deciding about, and its verdict stays 0."
K13 = "In addition each window gets one sentence explaining the verdict — with sun elevation, angle of incidence, watts at the glass, room temperature and daily forecast. Whoever cannot see why a window is being shaded switches the plugin off after the first surprise."
K14 = "Why the daily forecast and not the outside air"
K15 = "This is the heart of the matter. In July the gain is a burden, even at 19 degrees outside air in the morning — because the day will reach 28. In September it is welcome even if the room is still warm — because the day will reach 16. <b>The outside air at this instant does not answer that question.</b>"
K16 = "The day limit is therefore the expected daily maximum above which heat becomes a burden — default 20 degrees. Not to be confused with the heating limit temperature of building physics (typically 15 degrees): that refers to the daily mean, while this is the maximum, which runs about five kelvin higher in the transition season. The maximum temperature t+0 from Weather4Loxone is a suitable source."
K35 = "Look ahead: the verdict for half an hour from now"
K36 = "A blind needs its travel time, and the AutoJalousie block waits out its own delay on top so that a single cloud triggers nothing. A plugin that reports only the present moment therefore shades <b>systematically too late</b>. So the same calculation runs a second time for the moment half an hour ahead and leaves as values of its own: <span class='sm-mono'>FB_&lt;name&gt;_URTEIL30</span> and <span class='sm-mono'>FB_&lt;name&gt;_BESCHATTEN30</span>."
K37 = "What matters is what does <b>not</b> happen here: only the sun moves, the readings stay where they are. This is not a weather forecast but pure geometry — and therefore exactly as reliable as the sun position itself. In Loxone the two values are combined with OR: drive as soon as either one demands it. If a cloud arrives meanwhile, the value half an hour later is a different one anyway. The look ahead can be switched off with 0 seconds; its virtual inputs are then not created either."
K38 = "Glare, night insulation and position feedback"
K39 = "Three statements sit <b>beside</b> the verdict and are deliberately not mixed into it. Whoever stirs them together can no longer say afterwards why a window is closed — and precisely that inexplicability was the occasion for this plugin. Each of the three can be switched off individually and creates virtual inputs only when it is on."
K40 = "<b>Glare</b> (<span class='sm-mono'>FB_&lt;name&gt;_BLENDUNG</span>). When the sun stands low and hits the window head on it glares — even in January, when the heat is most welcome. The verdict then rightly says „let it in“, and still you want to set the slats at your desk. This takes effect per window only with a glare elevation entered."
K41 = "<b>Night insulation</b> (<span class='sm-mono'>FB_&lt;name&gt;_DAEMMEN</span>). A closed blind is thermal protection at night: the same energy balance, only with the opposite sign and without sun. It needs the outside temperature and is off by default — it drives blinds, and that belongs switched on deliberately."
K42 = "<b>Position feedback</b> (<span class='sm-mono'>FB_&lt;name&gt;_GEFAHREN</span>). Did Loxone actually carry the demand out? Without that answer the plugin issues a verdict and never sees what became of it — the very state from which the incident of 23 August arose. The value −1 means <b>no feedback</b> and is something other than 0 („standing wrong“); a deviation is reported only after a grace period, so that travel time does not count as a fault."
K17 = "What the plugin needs from outside"
K18 = "Two quantities always, two more per room, and one for each additional function switched on. They arrive through a virtual output from Loxone; the ready made import file is produced by the Loxone integration tab. Whatever is not switched on is not demanded either."
K19 = "<span class='sm-mono'>strahlung</span> — global irradiance on the horizontal in W/m². In this installation the combined value from Ecowitt and Weather4Loxone."
K21 = "<span class='sm-mono'>prognose</span> — expected daily maximum. This is the quantity that carries everything."
K22 = "<span class='sm-mono'>ist.&lt;room&gt;</span> and <span class='sm-mono'>grenze.&lt;room&gt;</span> — room temperature and shading limit. Several windows may name the same room."
K63 = "<b>Paste an extract (recommended).</b> The project file is almost four megabytes; what the plugin needs from it is about two and a half kilobytes. The bundled PowerShell script — downloadable in the Settings tab — reads it on your own machine and puts the extract on the clipboard. Paste it, press the button. This route needs neither a submission nor a file on the LoxBerry and therefore works even when the file manager refuses."
K58 = "The project file: two routes, and the convenient one usually fails"
K59 = "The window list can be filled from the Loxone project file. There are two ways to hand the file over:"
K60 = "<b>Put it on the LoxBerry (recommended).</b> Copy the <span class='sm-mono'>.Loxone</span> file via the Windows share, with WinSCP or by <span class='sm-mono'>scp</span> into <span class='sm-mono'>data/plugins/fensterbilanz/</span>. It then appears for selection in the Settings tab. <b>There is no size limit on this route</b>, because nothing is submitted — the plugin reads the file straight from the file system."
K61 = "<b>Submit it through the browser.</b> More convenient, but it fails on most installations: PHP accepts 2 MB per file by default, and a Loxone project file is 3 to 4 MB. The message then reads „error number 1“."
K62 = "<b>Why the plugin does not simply raise the limit:</b> <span class='sm-mono'>upload_max_filesize</span> and <span class='sm-mono'>post_max_size</span> apply per directory and cannot be changed from a running script — <span class='sm-mono'>ini_set()</span> reports failure for both, measured with PHP 7.4.33 and 8.4.24. Even if it worked it would be too late: PHP rejects the submission before the first line of the plugin runs. The two values the plugin does <b>read</b> itself, and it shows them <b>before</b> the form rather than bothering you with them after a wasted attempt. Whoever still wants to raise them finds them in the LoxBerry php.ini."
K54 = "The glass area: the one figure whose absence never shows"
K55 = "Each window row carries a <b>glass area in square metres</b>. What is meant is the glass, not the opening in the wall: width times height of the pane, about 90 percent of the structural dimension on a standard window. It has been there since the first version — and is still regularly overlooked, because the plugin delivers a correct verdict without it."
K56 = "That is not an accident but by design: <b>the verdict does not depend on the area.</b> The calculation runs in watts per square metre, and a small and a large south facing window want the same thing at the same time. What a forgotten area does spoil is something else — every watt figure, every watt hour, the daily balance and above all the measured <b>heat-up constant</b>. That is the only point at which this plugin measures its model against reality; out of nothing but default areas falls a figure with two decimal places that means nothing. And as soon as the daily balance carries a weight, the area does affect the verdict over the day."
K57 = "Because this never shows in operation, the plugin says so by itself: the window list points out every row still on the default, and the Test tab writes it <b>before</b> the heat-up constant rather than after it. <b>The glass area does not come from the project file</b> — the AutoJalousie block carries the direction and the slat dimensions (width and spacing in millimetres, identical for all 25 blinds in this installation), but no window dimensions. What the project file does supply are the <b>floor areas of the rooms</b>, and those decide at what amount of heat a room counts as full: 150 Wh per square metre is 750 Wh for a 5 m² bathroom and 3750 Wh for a 25 m² living room."
K20 = "<span class='sm-mono'>aussen</span> — outside temperature. <b>Optional</b> as long as night insulation is off: it then does not enter the verdict but appears in the explanation and in the log. If the outside sensor fails, the house does not lose its shading because of it."
K43 = "<span class='sm-mono'>prognose1</span> — expected daily maximum for <b>tomorrow</b>. Needed only when the evening term carries a weight. In version 0.9.0 this value was once on the list and was removed again because nobody read it; it is back now that it actually does something."
K44 = "<span class='sm-mono'>pv_prognose</span> — the yield forecast of the solar system as a comparison quantity for the reported irradiance. Needed only with the cross check switched on."
K45 = "<span class='sm-mono'>stellung.&lt;name&gt;</span> — the actual blind position in percent, per window. Needed only with position feedback switched on."
K23 = "Fail closed: a missing value means no verdict"
K24 = "A reading only counts while it is younger than the configured maximum age. If one is missing or too old, <b>nothing is guessed</b>: the verdict stays 0, shading stays 0, and <span class='sm-mono'>FB_OK</span> goes to 0. In Loxone the AutoJalousie block then falls back to its own release condition."
K25 = "That is the safe direction. A plugin that says „shade“ when data is missing darkens the house as soon as a cable comes loose. <b>Careful:</b> Loxone only sends a virtual output on value change. A forecast that does not move for hours eventually counts as stale here — so a cyclic pulse belongs with it in Loxone."
K46 = "The same applies to an <b>impossible</b> value. 662 W/m² at two degrees of sun elevation is not a reading but a defect: more than the sun can deliver at all at that position. Such values are rejected and reported, not bent down to what would just about be possible — a clamped value would afterwards look like a measured one."
K26 = "The shading horizon"
K27 = "A handful of support points per window of the form <span class='sm-mono'>80:22, 110:14, 160:6</span>, read as „from azimuth 80 degrees an obstacle stands 22 degrees high“. Between the points it is interpolated linearly, outside them the nearest point applies — not zero, because whoever entered only the eastern sector means nothing by it about the west."
K28 = "How strong the effect is can be seen from this installation's balcony module: facing east, shaded by the neighbouring house in the morning, daily peak only in the late forenoon. An angular range alone does not capture that — the AutoJalousie block then shades a window that no sun reaches at all. The values can be recorded at the window in a few minutes with a compass app and an inclinometer."
K47 = "Whether they are right is shown in a picture rather than in columns of figures: the Settings tab draws <b>sun path and horizon</b> on top of each other, per window. Where the grey area covers the path, no direct sun reaches this window. If the picture does not match what you see out of the window, a direction or a horizon is wrong — and you find it there in a minute instead of over a season."
K48 = "What accumulates over time"
K49 = "Three files survive every update on purpose, because they hold what cannot be recalculated. The <b>daily balance</b> counts the watt hours of the current day, per window and per room: a room that has swallowed three kilowatt hours since eight in the morning is full, even if the thermometer still reads 24 degrees. It is in the template from the start — look at it immediately, let it into the verdict only once you know it."
K50 = "From it comes the <b>heat up constant</b> per room in kelvin per kilowatt hour, measured at this installation instead of estimated. The fit passes through the origin — no heat, no warming. It is displayed with the number of days and the scatter: a constant from five days is none, and that should be visible rather than a matter of belief."
K51 = "The <b>daily report</b> sums up once in the evening how much sun came in, how many windows were shaded, which one longest and where the peak was. The <b>cross check against the PV yield forecast</b>, finally, is expressly not a second weather source: the calculated value remains the measured one. If the reported irradiance drifts away from the forecast over days, the sensor is probably soiled, shaded or misaligned. A warning is issued, nothing is changed."
K29 = "How accurate is this?"
K30 = "The sun position is accurate to a hundredth of a degree, calibrated against a second independent calculation using the PSA algorithm at 73 points across four seasons. The calibration found a real error during construction: the azimuth was mirrored about the north-south axis while the elevation was correct to 0.007 degrees — every east facing window would have been swapped with a west facing one."
K31 = "<b>Everything else is model, not measurement.</b> The split of global irradiance into direct and diffuse follows the correlation of Erbs, Klein and Duffie (1982), the angular dependence the ASHRAE incidence angle modifier. For the irradiance on the tilted glass there is a choice of two sky models: the isotropic one of Liu and Jordan and <b>HDKR</b> after Hay, Davies, Klucher and Reindl, which additionally knows the circumsolar brightening and the horizon band. The isotropic one runs by default, because it is the one everything else is calibrated against."
K52 = "<b>Why HDKR and not Perez.</b> Perez would be more accurate but requires a table of forty-eight published coefficients. They would have had to be written down here from memory, without being able to hold them against a second source — and a wrong digit among them would look exactly like a right one. HDKR needs not a single copied number and has two properties by which it can be checked: under an overcast sky it passes exactly into the isotropic model, and on a horizontal surface sky and circumsolar together give exactly the diffuse irradiance. The self test checks both. For the question „do I want this heat?“ that is more than enough — for a yield forecast it is not."
K32 = "Setting up in four steps"
K33 = "<b>First</b> enter the location in the Settings tab — without it nothing is calculated. <b>Second</b> fill the window list: either by hand, one row per window with short name, direction (the same figure as <span class='sm-mono'>Dir</span> in the AutoJalousie block), area, g value and room key — or read the project file. The button for that reads an uploaded <span class='sm-mono'>.Loxone</span> file, looks for all AutoJalousie blocks and proposes short name, direction and room. Only <b>empty</b> rows are filled; area, g value and horizon are added by hand. <b>Third</b> download and import <b>both</b> templates in the Loxone integration tab — the output template feeds the readings in, without it the plugin calculates nothing. <b>Fourth</b> press the self check in the Test tab."
K53 = "For trying things out there is also the <b>daily course</b> there — hour by hour, which window has sun when — and <b>what if</b>: running the whole model through with different limits and weights, <b>without saving</b>. It calculates with the actual readings of the moment, and next to it stands the state from the stored settings for comparison. That way a change is tried out before it affects the house."
K34 = "And then change nothing for a week, but run a statistics block in Loxone over <span class='sm-mono'>FB_&lt;name&gt;_URTEIL</span>. After that one picture shows whether day limit and weights fit — and you change them once properly instead of three times by feel."
