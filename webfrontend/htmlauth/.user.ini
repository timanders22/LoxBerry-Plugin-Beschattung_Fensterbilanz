; Fensterbilanz - Grenzen fuer DIESES Verzeichnis
;
; WOFUER: die Fensterliste laesst sich aus der Loxone-Projektdatei fuellen.
; Die ist 3 bis 4 MB gross, die Vorgabe von PHP fuer upload_max_filesize
; sind 2M - der Weg ueber den Browser scheitert damit auf jeder Anlage, die
; nichts anderes eingestellt hat.
;
; WARUM HIER UND NICHT IN DER php.ini: die php.ini gehoert dem System und
; gilt fuer jedes Plugin. Sie zu aendern braucht root; postinstall.sh laeuft
; als Benutzer loxberry. Und eine Grenze fuer alle zu verschieben, weil
; eines eine grosse Datei will, waere die falsche Reichweite. Diese Datei
; wirkt nur auf das Verzeichnis, in dem sie liegt.
;
; WANN SIE WIRKT: bei CGI, FastCGI und PHP-FPM. Laeuft PHP als
; Apache-Modul (mod_php), wird sie stillschweigend uebergangen - dann hilft
; nur die php.ini oder der Weg ueber den Ablageordner, den der Reiter
; Einstellungen anbietet. Kaputtgehen kann dabei nichts: eine unbeachtete
; .user.ini ist folgenlos. Der naheliegende Zwilling - .htaccess mit
; php_value - waere genau umgekehrt gefaehrlich: ohne mod_php quittiert
; Apache ihn mit einem Serverfehler und der ganze Webauftritt steht.
;
; NACHWIRKUNG: PHP merkt sich diese Datei bis zu user_ini.cache_ttl
; Sekunden (Vorgabe 300). Nach dem Installieren kann es also fuenf Minuten
; dauern, bis die neuen Werte gelten.
;
; post_max_size gilt fuer die GANZE Absendung und muss deshalb ueber
; upload_max_filesize liegen.
upload_max_filesize = 16M
post_max_size = 20M
