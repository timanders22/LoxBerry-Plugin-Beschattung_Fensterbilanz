<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Center Icon: Window with Half-Closed Shading Blinds (Centered X=256) -->
    <g transform="translate(256, 195)">
      <!-- Outer Window Frame -->
      <rect x="-70" y="-100" width="140" height="190" rx="14" fill="#ffffff" />
      
      <!-- Inner Glass Panes Cutout -->
      <rect x="-56" y="-86" width="112" height="162" rx="6" fill="#6dac20" />
      
      <!-- Vertical Window Frame Divider Bar -->
      <rect x="-4" y="-86" width="8" height="162" fill="#ffffff" />
      <!-- Horizontal Window Sill / Middle Rail -->
      <rect x="-56" y="-4" width="112" height="8" fill="#ffffff" />

      <!-- Shading Blind / Rollladen (Half-closed top down to Y=-4) -->
      <path d="M -56 -86 L 56 -86 L 56 -4 L -56 -4 Z" fill="#ffffff" />
      <!-- Slats Cutout in Blinds -->
      <line x1="-50" y1="-70" x2="50" y2="-70" stroke="#6dac20" stroke-width="5" stroke-linecap="round" />
      <line x1="-50" y1="-54" x2="50" y2="-54" stroke="#6dac20" stroke-width="5" stroke-linecap="round" />
      <line x1="-50" y1="-38" x2="50" y2="-38" stroke="#6dac20" stroke-width="5" stroke-linecap="round" />
      <line x1="-50" y1="-22" x2="50" y2="-22" stroke="#6dac20" stroke-width="5" stroke-linecap="round" />
      <!-- Bottom Heavy Rail of Blind -->
      <rect x="-54" y="-12" width="108" height="8" rx="2" fill="#6dac20" />
    </g>

    <!-- Flanking Left Symbol: Sun (Sonneneinstrahlung) -->
    <g transform="translate(100, 160)">
      <circle cx="0" cy="0" r="28" fill="#ffffff" />
      <circle cx="0" cy="0" r="13" fill="#6dac20" />
      <line x1="0" y1="-21" x2="0" y2="-17" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <line x1="0" y1="17" x2="0" y2="21" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-21" y1="0" x2="-17" y2="0" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <line x1="17" y1="0" x2="21" y2="0" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-14" y1="-14" x2="-11" y2="-11" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <line x1="11" y1="11" x2="14" y2="14" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <line x1="11" y1="-11" x2="14" y2="-14" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-14" y1="14" x2="-11" y2="11" stroke="#6dac20" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Flanking Right Symbol: Smart Home / Loxone Control -->
    <g transform="translate(412, 160)">
      <circle cx="0" cy="0" r="28" fill="#ffffff" />
      <path d="M -11 2 L 0 -9 L 11 2 L 11 11 C 11 13 9 14 7 14 L -7 14 C -9 14 -11 13 -11 11 Z" fill="#6dac20" />
      <rect x="-4" y="5" width="8" height="9" fill="#ffffff" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Beschattung</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
